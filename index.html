<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>しゃしんジグソー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#f5efe4; --sub:rgba(245,239,228,.62); --line:rgba(245,239,228,.18);
    --chip:rgba(255,255,255,.08); --accent:#f2c879; --accent-ink:#3a2a12;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font-family:"Zen Maru Gothic",system-ui,-apple-system,"Hiragino Maru Gothic ProN",sans-serif;
    color:var(--ink);
    background:radial-gradient(120% 90% at 50% 40%,#2f4d47 0%,#22372f 55%,#16241f 100%);
    -webkit-user-select:none;user-select:none;
  }
  body::before{ /* felt texture */
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
    background-size:3px 3px;
  }
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:18px;text-align:center}
  .screen.on{display:flex}
  h1{margin:0;font-size:34px;letter-spacing:.08em;font-weight:700}
  h1 small{display:block;font-size:13px;letter-spacing:.3em;color:var(--sub);font-weight:500;margin-top:8px}
  .logo{width:120px;height:120px;margin-bottom:4px}
  .btn{
    font:inherit;font-weight:700;font-size:17px;color:var(--ink);background:var(--chip);
    border:1px solid var(--line);border-radius:999px;padding:14px 28px;cursor:pointer;min-width:220px;
    transition:transform .12s, background .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn.main{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 6px 20px rgba(242,200,121,.25)}
  .btn.small{min-width:0;padding:9px 16px;font-size:14px}
  .btn.warn{color:#f3b0a4;border-color:rgba(243,154,138,.4)}
  .hint{font-size:13px;color:var(--sub);line-height:1.7;margin:0}
  .samps{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:420px;width:100%}
  .samp{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
  .samp:active{transform:scale(.97)}
  .samp canvas{width:100%;aspect-ratio:4/3;border-radius:10px;display:block}
  .samp b{font-size:14px}
  .samp span{font-size:11px;color:var(--sub);margin-top:-4px}
  #samples{justify-content:flex-start;overflow-y:auto;padding-top:max(24px,env(safe-area-inset-top))}
  .samps h3{grid-column:1/-1;margin:6px 0 -4px;font-size:14px;color:var(--accent);font-weight:700;text-align:left}
  #gallery{justify-content:flex-start;overflow-y:auto;padding-top:max(24px,env(safe-area-inset-top))}
  .gcard{position:relative}
  .gcard .cdel{top:-7px;right:-7px}
  .gsave{font-size:12px;color:var(--accent);border:1px solid rgba(242,200,121,.5);border-radius:999px;padding:3px 12px;margin-top:2px}
  input[type=file]{display:none}

  /* continue card on home */
  .cont{display:none;align-items:center;gap:14px;background:rgba(242,200,121,.12);border:1px solid rgba(242,200,121,.6);
    border-radius:18px;padding:10px 22px 10px 10px;cursor:pointer;font:inherit;color:var(--ink);text-align:left;min-width:240px}
  .cont.on{display:flex}
  .conts{display:flex;flex-direction:column;gap:10px;align-items:center}
  .cont{position:relative}
  .cdel{position:absolute;top:-9px;right:-9px;min-width:26px;height:26px;border-radius:13px;padding:0 7px;
    background:#24382f;border:1px solid var(--line);color:var(--sub);font:inherit;font-size:12px;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  .cdel.armed{color:#f3b0a4;border-color:rgba(243,154,138,.5)}
  #home.many .logo{width:76px;height:76px;margin-bottom:0}
  #home.many .hint{display:none}
  .cont:active{transform:scale(.97)}
  .cont canvas{width:64px;height:48px;border-radius:8px;flex:0 0 auto}
  .cont b{display:block;font-size:17px}
  .cont span{font-size:12px;color:var(--sub)}

  /* setup */
  #preview{max-width:min(86vw,520px);max-height:38vh;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .label{font-size:14px;color:var(--sub);margin:4px 0 -6px}
  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:420px}
  .chip{
    font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:14px;
    padding:8px 0;width:76px;cursor:pointer;line-height:1.2
  }
  .chip b{display:block;font-size:19px}
  .chip span{font-size:11px;color:var(--sub)}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
  .chip.on span{color:rgba(58,42,18,.7)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

  /* game */
  #game{padding:0;gap:0;justify-content:flex-start}
  .bar{
    width:100%;display:flex;align-items:center;gap:6px;padding:8px 10px;
    padding-top:max(8px,env(safe-area-inset-top));
    background:rgba(0,0,0,.18);border-bottom:1px solid rgba(255,255,255,.06);flex:0 0 auto
  }
  .stat{font-size:12px;color:var(--sub);white-space:nowrap;margin-right:auto;display:flex;flex-direction:column;gap:2px;padding-left:2px;line-height:1.2}
  .stat b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
  .ib{
    font:inherit;font-size:11px;color:var(--ink);background:var(--chip);border:1px solid var(--line);
    border-radius:12px;padding:5px 6px;cursor:pointer;line-height:1.1;min-width:38px;white-space:nowrap;flex:0 0 auto
  }
  .ib i{display:block;font-style:normal;font-size:16px;margin-bottom:1px}
  .ib.on{background:rgba(242,200,121,.25);border-color:rgba(242,200,121,.6)}
  #cv{flex:1 1 auto;width:100%;min-height:0;touch-action:none;display:block}
  #peek{
    position:absolute;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:42vw;max-height:30vh;
    border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.7);
    pointer-events:none;display:none
  }
  #peek.on{display:block}
  #game.sorting #peek{bottom:calc(84px + env(safe-area-inset-bottom))}

  /* zoom buttons */
  .zoom{position:absolute;left:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
  #game.sorting .zoom{bottom:calc(84px + env(safe-area-inset-bottom))}
  .zb{width:44px;height:44px;border-radius:50%;font:inherit;font-size:22px;font-weight:700;color:var(--ink);
    background:rgba(10,20,16,.62);border:1px solid var(--line);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;line-height:1}
  .zb:active{transform:scale(.93)}
  .zb.fit{font-size:11px;font-weight:500}

  .sortbar{position:relative;width:100%;flex:0 0 auto;display:none;gap:6px;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:rgba(10,20,16,.84);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-top:1px solid rgba(255,255,255,.08);
    overflow-x:auto;justify-content:safe center}
  .sortbar.on{display:flex}
  .sw{font:inherit;color:var(--ink);background:none;border:none;display:flex;flex-direction:column;align-items:center;
    gap:3px;min-width:46px;cursor:pointer;padding:2px;flex:0 0 auto}
  .sw .dot{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);display:flex;
    align-items:center;justify-content:center;font-size:15px;box-sizing:border-box}
  .sw.on .dot{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,200,121,.4)}
  .sw small{font-size:10px;color:var(--sub);white-space:nowrap}
  .sw:disabled{opacity:.28}
  .dot.all{background:conic-gradient(#f39a8a,#f2c879,#9fd8c8,#8fb3f0,#b8a6f0,#f39a8a)}
  .dot.edge{background:rgba(255,255,255,.08)}

  /* overlay */
  .overlay{position:fixed;inset:0;background:rgba(10,18,15,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
    display:none;align-items:center;justify-content:center;padding:24px;z-index:10}
  .overlay.on{display:flex;animation:fade .4s ease}
  .card{background:#24382f;border:1px solid var(--line);border-radius:20px;padding:24px 22px;max-width:420px;width:100%;
    display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .card h2{margin:0;font-size:26px;letter-spacing:.1em}
  .card p{margin:0;color:var(--sub);font-size:14px;line-height:1.7}
  #doneImg{max-width:100%;max-height:36vh;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .big{font-size:30px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:10px 18px;border-radius:999px;font-size:13px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
  .toast.on{opacity:1}
  .spark{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:11;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:.2}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <svg class="logo" viewBox="0 0 120 120" aria-hidden="true">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d48d"/><stop offset="1" stop-color="#e48f6a"/></linearGradient></defs>
    <path fill="url(#lg)" d="M20 22h26c-4-14 22-14 18 0h26v26c14-4 14 22 0 18v26H64c4 14-22 14-18 0H20V66c-14 4-14-22 0-18z" transform="translate(4 2)"/>
    <circle cx="48" cy="52" r="7" fill="rgba(255,255,255,.75)"/>
    <path d="M28 88l20-22 14 14 10-9 18 17z" fill="rgba(60,40,30,.35)"/>
  </svg>
  <h1>しゃしんジグソー<small>PHOTO JIGSAW</small></h1>
  <p class="hint">好きな写真をえらぶと、<br>ジグソーパズルになります。</p>
  <div class="conts" id="contList"></div>
  <label class="btn main" for="file">写真をえらぶ</label>
  <input id="file" type="file" accept="image/*">
  <button class="btn" id="sampleBtn">ビットアートギャラリー</button>
  <button class="btn small" id="galBtn">🖼 完成ギャラリー</button>
</section>

<!-- GALLERY -->
<section id="gallery" class="screen">
  <p class="label">完成ギャラリー</p>
  <p class="hint" id="galNote"></p>
  <div class="samps" id="galList"></div>
  <button class="btn small" id="galBack">もどる</button>
</section>

<!-- SAMPLES -->
<section id="samples" class="screen">
  <p class="label">ビットアートギャラリー</p>
  <div class="samps" id="sampList"></div>
  <button class="btn small" id="sampBack">もどる</button>
</section>

<!-- SETUP -->
<section id="setup" class="screen">
  <canvas id="preview"></canvas>
  <p class="label">ピースの数</p>
  <div class="chips" id="chips"></div>
  <button class="btn main" id="startBtn">はじめる</button>
  <p class="hint" id="overNote" style="display:none">※ 中断中のパズルは3つまで。<br>新しく始めると、いちばん前に遊んだものが消えます</p>
  <div class="row">
    <label class="btn small" for="file">写真をかえる</label>
    <button class="btn small" id="homeBtn">もどる</button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="bar">
    <div class="stat"><span>⏱ <b id="time">0:00</b></span><span>🧩 <b id="count">0/0</b></span></div>
    <button class="ib" id="peekBtn"><i>🖼</i>見本</button>
    <button class="ib" id="sortBtn"><i>🎨</i>分ける</button>
    <button class="ib" id="ghostBtn"><i>◐</i>うすく</button>
    <button class="ib" id="tidyBtn"><i>✦</i>並べる</button>
    <button class="ib" id="soundBtn"><i>🔈</i>音</button>
    <button class="ib" id="quitBtn"><i>⏸</i>中断</button>
  </div>
  <canvas id="cv"></canvas>
  <canvas id="peek"></canvas>
  <div class="zoom">
    <button class="zb" id="zinBtn" aria-label="拡大">＋</button>
    <button class="zb" id="zoutBtn" aria-label="縮小">－</button>
    <button class="zb fit" id="zfitBtn" aria-label="全体を表示">全体</button>
  </div>
  <div class="sortbar" id="sortBar"></div>
</section>

<!-- CLEAR -->
<div class="overlay" id="clear">
  <div class="card">
    <h2>かんせい！</h2>
    <canvas id="doneImg"></canvas>
    <div class="big" id="doneTime">0:00</div>
    <p id="doneInfo"></p>
    <button class="btn main" id="againBtn">同じ写真でもう一度</button>
    <button class="btn" id="newBtn">別の写真で遊ぶ</button>
    <div class="row"><button class="btn small" id="viewBtn">完成した絵をながめる</button><button class="btn small" id="dlBtn">📥 写真に保存</button></div>
  </div>
</div>

<!-- PAUSE / QUIT -->
<div class="overlay" id="confirm">
  <div class="card">
    <h2 style="font-size:20px">ひとやすみしますか？</h2>
    <p>ここまでのパズルは保存されます。<br>ホームの「つづきから」で再開できます。</p>
    <button class="btn main" id="pauseHomeBtn">中断してホームへ</button>
    <button class="btn" id="noBtn">つづける</button>
    <button class="btn small warn" id="eraseBtn">このパズルを消してやめる</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(()=>{
const $ = id => document.getElementById(id);
const DPR = Math.min(2, window.devicePixelRatio || 1);
const COUNTS = [12, 24, 48, 70, 100, 150];

let src = null;          // canvas holding the chosen picture
let selN = 24;
let G = null;            // game state
const view = {s:1, ox:0, oy:0, cw:0, ch:0};
const cv = $('cv'), ctx = cv.getContext('2d');
const hitCtx = document.createElement('canvas').getContext('2d');
let muted = false;
let vol = 2;
try{ const v = localStorage.getItem('photojigsaw-vol'); if (v !== null) vol = Math.max(0, Math.min(2, Number(v) || 0)); }catch(_){}

/* ---------- screens ---------- */
function show(id){
  for (const s of document.querySelectorAll('.screen')) s.classList.toggle('on', s.id === id);
}
function toast(msg, ms){
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  t.style.bottom = $('game').classList.contains('sorting') && $('game').classList.contains('on') ? '100px' : '';
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), ms || 1800);
}
document.addEventListener('gesturestart', e=>e.preventDefault());

/* ---------- saving (IndexedDB on this device) ---------- */
const store = (()=>{
  let dbp = null;
  function open(){
    if (!dbp) dbp = new Promise((res, rej)=>{
      try{
        const r = indexedDB.open('photojigsaw', 1);
        r.onupgradeneeded = ()=> r.result.createObjectStore('kv');
        r.onsuccess = ()=> res(r.result);
        r.onerror = ()=> rej(r.error);
      }catch(e){ rej(e); }
    });
    return dbp;
  }
  async function run(mode, fn){
    const db = await open();
    return new Promise((res, rej)=>{
      const tx = db.transaction('kv', mode), out = fn(tx.objectStore('kv'));
      tx.oncomplete = ()=> res(out && out.result);
      tx.onerror = tx.onabort = ()=> rej(tx.error);
    });
  }
  return {
    get: k => run('readonly', os => os.get(k)).catch(()=>undefined),
    put: (k, v) => run('readwrite', os => { os.put(v, k); }).then(()=>true, ()=>false),
    del: k => run('readwrite', os => { os.delete(k); }).catch(()=>{}),
    keys: () => run('readonly', os => os.getAllKeys()).catch(()=>[]),
  };
})();
const MAX_SLOTS = 3;     // how many paused puzzles are kept
const mem = new Map();   // id -> {st, blob}: in-memory copy too, in case storage is unavailable
let slots = [];          // paused puzzles shown on the home screen, most recently played first
let saveWarned = false, saveT = null;
function memOf(id){ let m = mem.get(id); if (!m){ m = {st:null, blob:null}; mem.set(id, m); } return m; }

// paused puzzles live in this browser (fast) and, when opened inside claude.ai, in claude.ai's storage too.
// On GitHub Pages there is no claude.ai storage, so everything stays in this browser.
const slotQ = new Map();              // one cloud write at a time per puzzle
function cloudSlot(id, fn){
  const p = (slotQ.get(id) || Promise.resolve()).then(fn).catch(()=>{});
  slotQ.set(id, p); return p;
}
async function cloudSlotWrite(id){
  await withTimeout(cloudReady, 12000).catch(()=>null);
  if (!cloud) return;
  const m = mem.get(id);
  if (!m || !m.st) return;
  if (!m.assetId && m.blob && !m.uploading){
    m.uploading = true;
    try{ const up = await cloud.assets.upload(m.blob); m.assetId = up.id; m.url = up.url || '/_blob/' + up.id; }
    finally{ m.uploading = false; }
  }
  if (!m.assetId || !mem.has(id)) return;
  await galCol().doc('slot-' + id).set({st:m.st, assetId:m.assetId, url:m.url});
}
async function loadSlots(){
  const keys = (await store.keys()) || [];
  // the older version kept just one puzzle under 'state' / 'img'
  if (keys.includes('state')){
    const [s, im] = await Promise.all([store.get('state'), store.get('img')]);
    if (s && im && s.id === im.id){
      await store.put('state-' + s.id, s); await store.put('img-' + s.id, im.blob);
      keys.push('state-' + s.id);
    }
    store.del('state'); store.del('img');
  }
  const ids = new Set(mem.keys());
  for (const k of keys) if (typeof k === 'string' && k.startsWith('state-')) ids.add(Number(k.slice(6)));
  const byId = new Map();
  for (const id of ids){
    const m = mem.get(id);
    const st = (m && m.st) || await store.get('state-' + id);
    const blob = (m && m.blob) || await store.get('img-' + id);
    if (st && blob) byId.set(id, {st, blob});
  }
  // add the ones saved in claude.ai (e.g. after the app was closed); the newer save wins
  await withTimeout(cloudReady, 12000).catch(()=>null);
  if (cloud){
    try{
      const snap = await withTimeout(galCol().get(), 12000);
      for (const d of snap.docs){
        if (!d.id.startsWith('slot-')) continue;
        const v = d.data(), id = Number(d.id.slice(5));
        if (!v || !v.st || !v.url) continue;
        const m = memOf(id); m.assetId = v.assetId; m.url = v.url;
        const have = byId.get(id);
        if (!have || (v.st.saved || 0) > (have.st.saved || 0)) byId.set(id, {st:v.st, blob:have && have.blob, url:v.url});
        else have.url = v.url;
        if (!m.st || (v.st.saved || 0) > (m.st.saved || 0)) m.st = byId.get(id).st;
      }
      // puzzles only in this browser (from before) go up to claude.ai too
      for (const [id, sl] of byId) if (!mem.get(id) || !mem.get(id).assetId){ const m = memOf(id); m.st = m.st || sl.st; m.blob = m.blob || sl.blob; cloudSlot(id, ()=> cloudSlotWrite(id)); }
    }catch(_){}
  }
  const out = [...byId.values()];
  out.sort((a, b)=> (b.st.saved || 0) - (a.st.saved || 0));
  return out;
}
async function pruneSlots(keepId){
  // keep the one just started plus the most recently played others
  const others = (await loadSlots()).filter(s => s.st.id !== keepId);
  for (const s of others.slice(MAX_SLOTS - 1)) clearSave(s.st.id);
}

function saveImage(id){
  try{
    src.toBlob(b=>{
      if (!b) return;
      memOf(id).blob = b;
      store.put('img-' + id, b);
      cloudSlot(id, ()=> cloudSlotWrite(id));
    }, 'image/jpeg', 0.88);
  }catch(_){}
}
function serialize(){
  const {cols, pieces} = G, idx = p => p.r*cols + p.c;
  const groups = [], seen = new Set();
  for (const p of pieces) if (p.g.locked && !seen.has(p.g)){ seen.add(p.g); groups.push({p:p.g.pieces.map(idx), x:0, y:0, l:1}); }
  for (const g of G.z) groups.push({p:g.pieces.map(idx), x:Math.round(g.ox*100)/100, y:Math.round(g.oy*100)/100});
  return {v:1, id:G.id, selN:G.selN, cols:G.cols, rows:G.rows, H:G.H, V:G.V, table:G.table, groups,
          elapsed:elapsedNow(), ghost:G.ghost, N:G.N, locked:G.locked, saved:Date.now(), name:G.name};
}
function saveNow(){
  clearTimeout(saveT);
  if (!G || G.done) return;
  const st = serialize();
  memOf(st.id).st = st;
  store.put('state-' + st.id, st).then(ok=>{

function clearSave(id){

const slotImage = s => s.blob ? blobToImage(s.blob) : loadUrl(s.url);

function blobToImage(blob){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(blob), im = new Image();
    im.onload = ()=>{ URL.revokeObjectURL(url); res(im); };
    im.onerror = e =>{ URL.revokeObjectURL(url); rej(e); };
    im.src = url;
  });
}

async function saveToDevice(blob, name){
  const filename = (name || 'jigsaw') + '.jpg';
  if (window.claude && window.claude.use){
    try{
      const dl = await claude.use('downloads');
      if (dl){
        const r = await dl.save({filename, data:blob});
        if (r && r.status === 'saved') toast('保存しました');
        return;
      }
    }catch(e){ if (e && e.code === 'declined') return; }
  }
  try{
    const file = new File([blob], filename, {type:'image/jpeg'});
    if (/iPhone|iPad|Android/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file]});
      return;
    }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  try{
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 5000);
    toast('保存しました');
  }catch(_){ toast('保存できませんでした'); }

/* ---------- piece shapes ---------- */
function edge(P, x1, y1, x2, y2, t, u){
  if (!t){ P.lineTo(x2, y2); return; }
  const dx = x2-x1, dy = y2-y1, L = Math.hypot(dx, dy);
  const ux = dx/L, uy = dy/L, nx = uy, ny = -ux;
  const pt = (a, b)=>{ const al = L/2 + (a-0.5)*u, bl = b*u*t; return [x1+ux*al+nx*bl, y1+uy*al+ny*bl]; };
  P.lineTo(...pt(0.35, 0));
  P.bezierCurveTo(...pt(0.41, 0),    ...pt(0.43, 0.07), ...pt(0.39, 0.13));
  P.bezierCurveTo(...pt(0.33, 0.23), ...pt(0.39, 0.31), ...pt(0.50, 0.31));
  P.bezierCurveTo(...pt(0.61, 0.31), ...pt(0.67, 0.23), ...pt(0.61, 0.13));
  P.bezierCurveTo(...pt(0.57, 0.07), ...pt(0.59, 0),    ...pt(0.65, 0));
  P.lineTo(x2, y2);
}
function piecePath(w, h, top, right, bottom, left){
  const u = Math.min(w, h), P = new Path2D();
  P.moveTo(0, 0);
  edge(P, 0, 0, w, 0, top, u);
  edge(P, w, 0, w, h, right, u);
  edge(P, w, h, 0, h, bottom, u);
  edge(P, 0, h, 0, 0, left, u);
  P.closePath();
  return P;
}

/* ---------- game setup ---------- */
function measure(){
  const r = cv.getBoundingClientRect();
  view.cw = r.width; view.ch = r.height;
  cv.width = Math.round(r.width*DPR); cv.height = Math.round(r.height*DPR);
}
function fitScaleFor(t){ return Math.min((view.cw - 8)/t.w, (view.ch - 8)/t.h); }

function startGame(saved){
  measure();
  const aspect = src.width/src.height;
  const [cols, rows] = saved ? [saved.cols, saved.rows] : gridFor(selN, aspect);
  const BW = aspect >= 1 ? 1000 : 1000*aspect;
  const BH = aspect >= 1 ? 1000/aspect : 1000;
  const w = BW/cols, h = BH/rows, u = Math.min(w, h);
  const m = 0.33*u;

  let table;
  if (saved) table = saved.table;
  else {
    // table: same shape as the screen, board takes a bit over 40% of it
    const sa = view.cw/Math.max(1, view.ch);
    const frac = selN >= 100 ? 0.36 : 0.42;
    let TW = Math.sqrt(BW*BH/frac*sa), TH = TW/sa;
    const need = Math.max(BW*1.1/TW, BH*1.1/TH, 1);
    TW *= need; TH *= need;
    table = {x:-(TW-BW)/2, y:-(TH-BH)/2, w:TW, h:TH};
    // put the board a little higher than centre so the bottom pile has room
    if (TH - BH > 2*m){ const shift = (TH-BH)*0.08; table.y += shift; }
  }

  const s0 = fitScaleFor(table);
  const M = m + 10/s0;

  let H, V;
  if (saved){ H = saved.H; V = saved.V; }
  else {
    H = []; V = [];
    for (let r = 0; r < rows; r++){ H[r] = []; V[r] = [];
      for (let c = 0; c < cols; c++){ H[r][c] = Math.random() < .5 ? 1 : -1; V[r][c] = Math.random() < .5 ? 1 : -1; } }
  }

  const pieces = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const top = r > 0 ? -H[r][c] : 0, bottom = r < rows-1 ? H[r+1][c] : 0;
    const left = c > 0 ? -V[r][c] : 0, right = c < cols-1 ? V[r][c+1] : 0;
    pieces.push({c, r, cx:c*w, cy:r*h, path:piecePath(w, h, top, right, bottom, left), edge: !(top && bottom && left && right), g:null});
  }
  G = {cols, rows, w, h, BW, BH, m, M, table, pieces, z:[], N:pieces.length, locked:0, H, V,
       selN: saved ? saved.selN : selN, id: saved ? saved.id : Date.now(), s0, rs:0, rsView:0,
       start:performance.now() - (saved ? saved.elapsed || 0 : 0), pausedAt:0,
       done:false, ghost: saved ? !!saved.ghost : false, filter:null, flashes:[], name: saved ? saved.name || '' : src.name || ''};

  if (saved){
    for (const sg of saved.groups){
      const g = {pieces: sg.p.map(i => pieces[i]), ox: sg.x, oy: sg.y, locked: !!sg.l};
      for (const p of g.pieces) p.g = g;
      if (g.locked) G.locked += g.pieces.length; else G.z.push(g);
    }
    for (const p of pieces) if (!p.g){ const g = {pieces:[p], ox:0, oy:0, locked:false}; p.g = g; G.z.push(g); }
    G.z.forEach(clampGroup);
    computeColors();
  } else {
    for (const p of pieces){ const g = {pieces:[p], ox:0, oy:0, locked:false}; p.g = g; G.z.push(g); }
    computeColors();
    scatter(G.z);
    const z = G.z;
    for (let i = z.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [z[i], z[j]] = [z[j], z[i]]; }
  }

  $('ghostBtn').classList.toggle('on', G.ghost); $('sortBtn').classList.remove('on'); $('sortBar').classList.remove('on'); $('game').classList.remove('sorting'); $('peekBtn').classList.remove('on'); $('peek').classList.remove('on');
  const pk = $('peek'); pk.width = Math.min(600, src.width); pk.height = Math.round(pk.width*src.height/src.width);
  pk.getContext('2d').drawImage(src, 0, 0, pk.width, pk.height);

  fitView(); renderPieces(); updateStat(); dirty();
  if (!saved){ saveImage(G.id); ensureAudio(); setTimeout(()=>sound('shuffle'), 150); }
  else toast('つづきから再開します');
  saveNow();
  if (!saved) pruneSlots(G.id);

  let seen = false;
  try{ seen = localStorage.getItem('photojigsaw-zoomhint') === '1'; localStorage.setItem('photojigsaw-zoomhint', '1'); }catch(_){}
  if (!seen && !saved) setTimeout(()=>toast('2本指でひろげると拡大・すきまをなぞると移動', 3600), 600);
}

function scatter(groups, near){
  // place single-piece groups in free slots around the board
  const {w, h, m, table:t, BW, BH} = G;
  const need = groups.filter(g => !g.locked && g.pieces.length === 1).length;
  const x0 = t.x + m, x1 = t.x + t.w - w - m, y0 = t.y + m, y1 = t.y + t.h - h - m;
  let slots = [];
  // shrink the spacing until every piece has a spot outside the board (pieces may overlap a little)
  for (let f = 1.25; f >= 0.55; f -= 0.05){
    const sx = w*f + m*0.4*f, sy = h*f + m*0.4*f;
    slots = [];
    const cx = Math.max(1, Math.floor((x1 - x0)/sx) + 1), cy = Math.max(1, Math.floor((y1 - y0)/sy) + 1);
    const gx = cx > 1 ? (x1 - x0)/(cx - 1) : 0, gy = cy > 1 ? (y1 - y0)/(cy - 1) : 0;
    for (let j = 0; j < cy; j++) for (let i = 0; i < cx; i++){
      const x = x0 + i*gx, y = y0 + j*gy;
      const overlap = x + w > -m*0.3 && x < BW + m*0.3 && y + h > -m*0.3 && y < BH + m*0.3;
      if (!overlap) slots.push([x, y]);
    }
    if (slots.length >= need) break;
  }
  for (let i = slots.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
  if (near){
    // closest to the board first, so the picked-out pieces gather around it
    const d = ([x, y])=>{ const cx = x + w/2, cy = y + h/2;
      const dx = Math.max(0, -cx, cx - BW), dy = Math.max(0, -cy, cy - BH); return Math.hypot(dx, dy); };
    slots.sort((a, b)=> d(a) - d(b));
    groups = groups.slice();
    for (let i = groups.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [groups[i], groups[j]] = [groups[j], groups[i]]; }
  }
  let k = 0;
  for (const g of groups){
    if (g.locked || g.pieces.length !== 1) continue;
    const p = g.pieces[0];
    let x, y;
    if (k < slots.length){
      [x, y] = slots[k++];
      x += (Math.random()-.5)*w*0.16; y += (Math.random()-.5)*h*0.16;
    } else {
      x = x0 + Math.random()*(x1-x0); y = y0 + Math.random()*(y1-y0);
    }
    g.ox = x - p.cx; g.oy = y - p.cy;
  }
}

/* ---------- zoom & pan ---------- */
function fitView(rerender){
  G.s0 = fitScaleFor(G.table);
  const t = G.table;
  view.s = G.s0;
  view.ox = (view.cw - t.w*view.s)/2 - t.x*view.s;
  view.oy = (view.ch - t.h*view.s)/2 - t.y*view.s;
  if (rerender){ dirty(); scheduleRerender(); }
}
function clampScale(s){ return Math.max(G.s0*0.9, Math.min(G.s0*8, s)); }
function clampView(){
  // keep the table filling the screen when zoomed in, centred when it fits
  const t = G.table, s = view.s;
  const x0 = view.ox + t.x*s, tw = t.w*s, y0 = view.oy + t.y*s, th = t.h*s;
  if (tw <= view.cw) view.ox += (view.cw - tw)/2 - x0;
  else { if (x0 > 0) view.ox -= x0; else if (x0 + tw < view.cw) view.ox += view.cw - (x0 + tw); }
  if (th <= view.ch) view.oy += (view.ch - th)/2 - y0;
  else { if (y0 > 0) view.oy -= y0; else if (y0 + th < view.ch) view.oy += view.ch - (y0 + th); }
}
function zoomTo(ns, sx, sy){
  ns = clampScale(ns);
  const wx = (sx - view.ox)/view.s, wy = (sy - view.oy)/view.s;
  view.s = ns; view.ox = sx - wx*ns; view.oy = sy - wy*ns;
  clampView(); dirty(); scheduleRerender();
}
$('zinBtn').onclick = ()=>{ if (G) zoomTo(view.s*1.6, view.cw/2, view.ch/2); };
$('zoutBtn').onclick = ()=>{ if (G) zoomTo(view.s/1.6, view.cw/2, view.ch/2); };
$('zfitBtn').onclick = ()=>{ if (G) fitView(true); };

/* ---------- piece images ---------- */
function targetRS(){
  // sharp enough for the current zoom, but capped so many pieces don't eat all the memory
  const maxPx = Math.max(220, Math.min(720, Math.sqrt(9e6/G.N)));
  return Math.min(view.s*DPR, maxPx/(G.w + 2*G.M));
}
let rrT = null;
function scheduleRerender(){
  clearTimeout(rrT);
  rrT = setTimeout(()=>{
    if (!G) return;
    if (mode === 'pinch'){ scheduleRerender(); return; }
    const tr = targetRS();
    if (Math.abs(Math.log(tr/G.rs)) > 0.15 || Math.abs(Math.log(view.s/G.rsView)) > 0.45){ renderPieces(); dirty(); }
  }, 200);
}
function renderPieces(){
  const S = targetRS(), {w, h, M, BW, BH} = G;
  G.rs = S; G.rsView = view.s;
  const kx = src.width/BW, ky = src.height/BH;
  const pw = Math.ceil((w+2*M)*S), ph = Math.ceil((h+2*M)*S);
  for (const p of G.pieces){
    const c = document.createElement('canvas'); c.width = pw; c.height = ph;
    const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
    x.setTransform(S, 0, 0, S, M*S, M*S);
    x.save();
    x.clip(p.path);
    const x0 = Math.max(0, p.cx - M), y0 = Math.max(0, p.cy - M);
    const x1 = Math.min(BW, p.cx + w + M), y1 = Math.min(BH, p.cy + h + M);
    x.drawImage(src, x0*kx, y0*ky, (x1-x0)*kx, (y1-y0)*ky, x0 - p.cx, y0 - p.cy, x1 - x0, y1 - y0);
    x.lineWidth = 3.2/view.s; x.strokeStyle = 'rgba(0,0,0,.30)'; x.stroke(p.path);
    x.restore();
    x.lineWidth = 1/view.s; x.strokeStyle = 'rgba(255,255,255,.38)'; x.stroke(p.path);
    p.img = c;
    const c2 = document.createElement('canvas'); c2.width = pw; c2.height = ph;
    const y = c2.getContext('2d');
    y.shadowColor = 'rgba(0,0,0,.45)'; y.shadowBlur = 5*S/view.s; y.shadowOffsetY = 2*S/view.s;
    y.drawImage(c, 0, 0);
    p.imgS = c2;
  }
}

/* ---------- drawing ---------- */
let pending = false;
function dirty(){ if (!pending){ pending = true; requestAnimationFrame(frame); } }
function frame(){
  pending = false;
  let more = !!(G && G.flashes.length);
  if (G && mode === 'piece' && drag) more = autoPan() || more;
  render();
  if (more) dirty();
}

function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, view.cw, view.ch);
  if (!G) return;
  const {s, ox, oy} = view, {BW, BH, M, w, h} = G;
  // board
  ctx.fillStyle = 'rgba(0,0,0,.24)';
  ctx.fillRect(ox, oy, BW*s, BH*s);
  if (G.ghost){ ctx.globalAlpha = .26; ctx.drawImage(src, ox, oy, BW*s, BH*s); ctx.globalAlpha = 1; }
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1;
  ctx.strokeRect(ox-.5, oy-.5, BW*s+1, BH*s+1);

  const dw = (w+2*M)*s, dh = (h+2*M)*s;
  const put = (im, px, py)=>{ if (px + dw > 0 && py + dh > 0 && px < view.cw && py < view.ch) ctx.drawImage(im, px, py, dw, dh); };
  for (const p of G.pieces) if (p.g.locked)
    put(p.img, ox + (p.cx - M)*s, oy + (p.cy - M)*s);
  // pieces set aside (inner pieces while picking out edges) are drawn faint underneath
  if (G.filter !== null){
    ctx.globalAlpha = .16;
    for (const g of G.z) if (!active(g)) for (const p of g.pieces)
      put(p.img, ox + (p.cx + g.ox - M)*s, oy + (p.cy + g.oy - M)*s);
    ctx.globalAlpha = 1;
  }
  for (const g of G.z) if (active(g)) for (const p of g.pieces)
    put(p.imgS, ox + (p.cx + g.ox - M)*s, oy + (p.cy + g.oy - M)*s);

  // snap glow
  const now = performance.now();
  G.flashes = G.flashes.filter(f => now - f.t < 650);
  for (const f of G.flashes){
    const a = 1 - (now - f.t)/650;
    for (const p of f.g.pieces){
      ctx.setTransform(DPR*s, 0, 0, DPR*s, DPR*(ox + (p.cx + f.g.ox)*s), DPR*(oy + (p.cy + f.g.oy)*s));
      ctx.strokeStyle = `rgba(255,236,190,${a*.9})`; ctx.lineWidth = (2 + 3*a)/s;
      ctx.stroke(p.path);
    }
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  // when only a few loose pieces are left, an arrow at the edge points to any that are off screen
  if (G.z.length && G.z.length <= 6) for (const g of G.z){
    if (!active(g) || onScreen(g)) continue;
    const b = groupBox(g), pad = 24;
    const ax = Math.max(pad, Math.min(view.cw - pad, b.cx)), ay = Math.max(pad, Math.min(view.ch - pad, b.cy));
    ctx.save(); ctx.translate(ax, ay);
    ctx.fillStyle = 'rgba(10,20,16,.78)'; ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.fill();
    ctx.strokeStyle = 'rgba(242,200,121,.95)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.rotate(Math.atan2(b.cy - ay, b.cx - ax));
    ctx.fillStyle = '#f2c879'; ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(-5, -7); ctx.lineTo(-5, 7); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}
function groupBox(g){
  const {w, h} = G, {s, ox, oy} = view;
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const p of g.pieces){ x0 = Math.min(x0, p.cx); x1 = Math.max(x1, p.cx + w); y0 = Math.min(y0, p.cy); y1 = Math.max(y1, p.cy + h); }
  return {cx: ox + ((x0 + x1)/2 + g.ox)*s, cy: oy + ((y0 + y1)/2 + g.oy)*s};
}
function onScreen(g){ const b = groupBox(g); return b.cx > 0 && b.cx < view.cw && b.cy > 0 && b.cy < view.ch; }
function showAllIfHidden(gs){ if (gs.some(g => !onScreen(g))) fitView(true); }
function matches(p){ return G.filter === 'edge' ? p.edge : p.col === G.filter; }
function active(g){ return G.filter === null || g.pieces.some(matches); }

/* ---------- colour groups ---------- */
function toLab([r, g, b]){
  const f = v => { v /= 255; return v <= 0.04045 ? v/12.92 : Math.pow((v + 0.055)/1.055, 2.4); };
  const R = f(r), Gg = f(g), B = f(b);
  let X = (R*0.4124 + Gg*0.3576 + B*0.1805)/0.95047, Y = R*0.2126 + Gg*0.7152 + B*0.0722, Z = (R*0.0193 + Gg*0.1192 + B*0.9505)/1.08883;
  const h = t => t > 0.008856 ? Math.cbrt(t) : 7.787*t + 16/116;
  X = h(X); Y = h(Y); Z = h(Z);
  return [116*Y - 16, 500*(X - Y), 200*(Y - Z)];
}
function computeColors(){
  const {cols, rows, pieces, N} = G, k = 8;
  const c = document.createElement('canvas'); c.width = cols*k; c.height = rows*k;
  const x = c.getContext('2d', {willReadFrequently:true});
  x.drawImage(src, 0, 0, c.width, c.height);
  const d = x.getImageData(0, 0, c.width, c.height).data;
  for (const p of pieces){
    let r = 0, g = 0, b = 0;
    for (let yy = 0; yy < k; yy++) for (let xx = 0; xx < k; xx++){
      const i = ((p.r*k + yy)*c.width + p.c*k + xx)*4; r += d[i]; g += d[i+1]; b += d[i+2];
    }
    p.rgb = [r/(k*k), g/(k*k), b/(k*k)]; p.lab = toLab(p.rgb);
  }
  const K = Math.min(N <= 24 ? 4 : N <= 70 ? 5 : 6, N);
  const dist = (a, b)=> (a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2;
  // k-means++ start
  let cent = [pieces[Math.floor(Math.random()*N)].lab.slice()];
  while (cent.length < K){
    const ds = pieces.map(p => Math.min(...cent.map(c0 => dist(p.lab, c0))));
    const tot = ds.reduce((a, b)=>a + b, 0);
    if (!tot) break;
    let t = Math.random()*tot, i = 0;
    while (t > ds[i] && i < N - 1){ t -= ds[i]; i++; }
    cent.push(pieces[i].lab.slice());
  }
  for (let it = 0; it < 20; it++){
    for (const p of pieces){ let best = 0, bd = Infinity; cent.forEach((c0, i)=>{ const dd = dist(p.lab, c0); if (dd < bd){ bd = dd; best = i; } }); p.col = best; }
    const acc = cent.map(()=>[0, 0, 0, 0]);
    for (const p of pieces){ const a = acc[p.col]; a[0] += p.lab[0]; a[1] += p.lab[1]; a[2] += p.lab[2]; a[3]++; }
    cent = acc.filter(a => a[3]).map(a => [a[0]/a[3], a[1]/a[3], a[2]/a[3]]);
  }
  for (const p of pieces){ let best = 0, bd = Infinity; cent.forEach((c0, i)=>{ const dd = dist(p.lab, c0); if (dd < bd){ bd = dd; best = i; } }); p.col = best; }
  // order swatches light → dark and give each its average colour
  const groups = cent.map((c0, i)=>{
    const mem = pieces.filter(p => p.col === i);
    const rgb = [0, 1, 2].map(j => Math.round(mem.reduce((a, p)=>a + p.rgb[j], 0)/Math.max(1, mem.length)));
    return {i, L:c0[0], rgb, n:mem.length};
  }).filter(o => o.n).sort((a, b)=> b.L - a.L);
  const remap = {}; groups.forEach((o, j)=> remap[o.i] = j);
  for (const p of pieces) p.col = remap[p.col];
  G.colors = groups.map(o => o.rgb);
}
function renderPalette(){
  const bar = $('sortBar'); if (!G) return;
  const loose = G.pieces.filter(p => !p.g.locked);
  const items = [{f:null, cls:'all', label:'ぜんぶ', n:loose.length},
                 {f:'edge', cls:'edge', label:'ふち', n:loose.filter(p => p.edge).length, icon:'▢'}];
  G.colors.forEach((rgb, i)=> items.push({f:i, color:`rgb(${rgb})`, label:`${loose.filter(p => p.col === i).length}こ`, n:loose.filter(p => p.col === i).length}));
  bar.innerHTML = '';
  for (const it of items){
    const b = document.createElement('button');
    b.className = 'sw' + (G.filter === it.f ? ' on' : '');
    b.disabled = it.f !== null && !it.n;
    b.innerHTML = `<span class="dot ${it.cls || ''}" style="${it.color ? 'background:' + it.color : ''}">${it.icon || ''}</span><small>${it.label}</small>`;
    b.onclick = ()=> setFilter(G.filter === it.f ? null : it.f, true);
    bar.appendChild(b);
  }
}

/* ---------- interaction ---------- */
function pick(wx, wy){
  const {w, h, m} = G;
  for (let i = G.z.length-1; i >= 0; i--){
    const g = G.z[i];
    if (!active(g)) continue;
    for (const p of g.pieces){
      const lx = wx - p.cx - g.ox, ly = wy - p.cy - g.oy;
      if (lx < -m || ly < -m || lx > w+m || ly > h+m) continue;
      if (hitCtx.isPointInPath(p.path, lx, ly)) return g;
    }
  }
  // forgiving second pass for fingers
  const tol = 10/view.s;
  for (let i = G.z.length-1; i >= 0; i--){
    const g = G.z[i];
    if (!active(g)) continue;
    for (const p of g.pieces){
      const lx = wx - p.cx - g.ox, ly = wy - p.cy - g.oy;
      if (lx > -tol && ly > -tol && lx < w+tol && ly < h+tol) return g;
    }
  }
  return null;
}

// one finger on a piece = move it, one finger on empty space = slide the view, two fingers = zoom
const pts = new Map();
let mode = null, drag = null, pan = null, pinch = null, lastTap = null;
function spos(e){ const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function startPinch(){
  const [a, b] = [...pts.values()];
  pinch = {d:Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), s:view.s,
           wx:((a.x + b.x)/2 - view.ox)/view.s, wy:((a.y + b.y)/2 - view.oy)/view.s};
  mode = 'pinch'; pan = null;
}
cv.addEventListener('pointerdown', e=>{
  if (!G) return;
  ensureAudio();
  const p = spos(e);
  pts.set(e.pointerId, p);
  try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  if (mode === 'piece') return;
  if (pts.size >= 2){ startPinch(); return; }
  const wx = (p.x - view.ox)/view.s, wy = (p.y - view.oy)/view.s;
  const g = G.done ? null : pick(wx, wy);
  if (g){
    mode = 'piece';
    drag = {g, id:e.pointerId, lx:wx, ly:wy, sx:p.x, sy:p.y};
    G.z.splice(G.z.indexOf(g), 1); G.z.push(g);
    sound('pick');
    dirty();
  } else {
    mode = 'pan';
    pan = {id:e.pointerId, x:p.x, y:p.y, x0:p.x, y0:p.y, t:performance.now()};
  }
});
cv.addEventListener('pointermove', e=>{
  if (!pts.has(e.pointerId)) return;
  const p = spos(e); pts.set(e.pointerId, p);
  if (mode === 'piece' && e.pointerId === drag.id){
    drag.sx = p.x; drag.sy = p.y;
    const wx = (p.x - view.ox)/view.s, wy = (p.y - view.oy)/view.s;
    drag.g.ox += wx - drag.lx; drag.g.oy += wy - drag.ly;
    drag.lx = wx; drag.ly = wy;
    clampGroup(drag.g);
    dirty();
  } else if (mode === 'pan' && e.pointerId === pan.id){
    view.ox += p.x - pan.x; view.oy += p.y - pan.y; pan.x = p.x; pan.y = p.y;
    clampView(); dirty();
  } else if (mode === 'pinch' && pts.size >= 2){
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), cx = (a.x + b.x)/2, cy = (a.y + b.y)/2;
    view.s = clampScale(pinch.s*d/pinch.d);
    view.ox = cx - pinch.wx*view.s; view.oy = cy - pinch.wy*view.s;
    clampView(); dirty();
  }
});
function pointerEnd(e){

  if (mode === 'piece'){
    if (e.pointerId !== drag.id) return;
    const g = drag.g; drag = null; mode = null;
    if (!snap(g)) sound('drop');
    scheduleSave(); dirty();
  } else if (mode === 'pinch'){
    if (pts.size >= 2) startPinch();
    else if (pts.size === 1){ const [id, p] = [...pts.entries()][0]; mode = 'pan'; pan = {id, x:p.x, y:p.y, x0:p.x, y0:p.y, t:0}; }

    const tap = e.type === 'pointerup' && Math.hypot(pan.x - pan.x0, pan.y - pan.y0) < 8 && performance.now() - pan.t < 300;
    if (tap){
      const now = performance.now();
      if (lastTap && now - lastTap.t < 340 && Math.hypot(pan.x - lastTap.x, pan.y - lastTap.y) < 30){
        lastTap = null;
        if (view.s < G.s0*1.4) zoomTo(G.s0*2.5, pan.x, pan.y); else fitView(true);
      } else lastTap = {t:now, x:pan.x, y:pan.y};
    }

cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('wheel', e=>{
  if (!G) return;

  const p = spos(e);
  const dy = e.deltaY*(e.deltaMode === 1 ? 16 : 1);
  zoomTo(view.s*Math.exp(-dy*(e.ctrlKey ? 0.01 : 0.0015)), p.x, p.y);
}, {passive:false});

// while carrying a piece near the edge of a zoomed-in view, the view slides along
function autoPan(){
  if (view.s <= G.s0*1.02) return false;
  const Z = 44, sp = 14;
  const f = (v, max)=> Math.max(-1, Math.min(1, v < Z ? (Z - v)/Z : v > max - Z ? -(v - (max - Z))/Z : 0));
  const fx = f(drag.sx, view.cw), fy = f(drag.sy, view.ch);
  if (!fx && !fy) return false;
  const ox = view.ox, oy = view.oy;
  view.ox += fx*sp; view.oy += fy*sp;
  clampView();
  if (Math.abs(view.ox - ox) < 0.01 && Math.abs(view.oy - oy) < 0.01) return false;
  const wx = (drag.sx - view.ox)/view.s, wy = (drag.sy - view.oy)/view.s;
  drag.g.ox += wx - drag.lx; drag.g.oy += wy - drag.ly;
  drag.lx = wx; drag.ly = wy;
  clampGroup(drag.g);
  return true;
}

function clampGroup(g){
  const {w, h, table:t} = G;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const p of g.pieces){ minX = Math.min(minX, p.cx); maxX = Math.max(maxX, p.cx+w); minY = Math.min(minY, p.cy); maxY = Math.max(maxY, p.cy+h); }
  const keepX = w*0.6, keepY = h*0.6;
  if (maxX + g.ox < t.x + keepX) g.ox = t.x + keepX - maxX;
  if (minX + g.ox > t.x + t.w - keepX) g.ox = t.x + t.w - keepX - minX;
  if (maxY + g.oy < t.y + keepY) g.oy = t.y + keepY - maxY;
  if (minY + g.oy > t.y + t.h - keepY) g.oy = t.y + t.h - keepY - minY;
}

function neighbors(p){
  const out = [], {cols, rows} = G, idx = (c, r)=> G.pieces[r*cols + c];
  if (p.c > 0) out.push(idx(p.c-1, p.r));
  if (p.c < cols-1) out.push(idx(p.c+1, p.r));
  if (p.r > 0) out.push(idx(p.c, p.r-1));
  if (p.r < rows-1) out.push(idx(p.c, p.r+1));
  return out;
}
function snap(g){
  const tol = Math.max(16/view.s, Math.min(G.w, G.h)*0.2);
  let merged = false, again = true;
  while (again){
    again = false;
    outer:
    for (const p of g.pieces){
      for (const q of neighbors(p)){
        const o = q.g;
        if (o === g || o.locked) continue;
        if (Math.abs(o.ox - g.ox) < tol && Math.abs(o.oy - g.oy) < tol){
          g.ox = o.ox; g.oy = o.oy;
          for (const r of o.pieces){ r.g = g; g.pieces.push(r); }
          G.z.splice(G.z.indexOf(o), 1);
          merged = again = true;
          break outer;
        }
      }
    }
  }
  if (Math.abs(g.ox) < tol && Math.abs(g.oy) < tol){
    g.ox = 0; g.oy = 0; g.locked = true;
    G.z.splice(G.z.indexOf(g), 1);
    G.locked += g.pieces.length;
    G.flashes.push({g, t:performance.now()});
    const before = G.locked - g.pieces.length;
    sound('lock', g.pieces.length);
    updateStat();
    if (G.locked === G.N) finish();
    else if (G.filter !== null && !G.z.some(o => o.pieces.some(matches))){
      sound('done');
      const wasEdge = G.filter === 'edge';
      setFilter(null);
      toast(wasEdge ? 'ふちが完成！ 残りのピースをもどしました' : 'この色はぜんぶはまりました！');
    }
    else if (G.N >= 24 && [0.25, 0.5, 0.75].some(f => before < G.N*f && G.locked >= G.N*f)) sound('milestone');
    renderPalette();
    return true;
  } else if (merged){
    G.flashes.push({g, t:performance.now()});
    sound('merge');
    return true;
  }
  return false;
}

/* ---------- sound ---------- */
// volume: 2 = 大, 1 = 小, 0 = なし (remembered on this device)
let AC = null, MASTER = null, NOISE = null, audioStale = false;
// after leaving the page, phones (iPhone especially) can bring the old audio back quieter,
// so the old one is thrown away and a fresh one is made on the next tap
function dropAudio(){
  if (AC){ try{ AC.close(); }catch(_){} }
  AC = null; MASTER = null; audioStale = false;
}
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && AC) audioStale = true; });
window.addEventListener('pagehide', ()=>{ if (AC) audioStale = true; });
window.addEventListener('pageshow', e=>{ if (e.persisted && AC) audioStale = true; });
function ensureAudio(){
  try{
    if (AC && (audioStale || AC.state === 'interrupted' || AC.state === 'closed')) dropAudio();
    if (!AC){
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const comp = AC.createDynamicsCompressor();
      comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      MASTER = AC.createGain(); MASTER.gain.value = VOLS[vol];
      MASTER.connect(comp).connect(AC.destination);
      const n = AC.sampleRate*0.5, b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1;
      NOISE = b;
    }
    if (AC.state === 'suspended') AC.resume();
  }catch(_){}
}
const VOLS = [0, 0.45, 1];
function applyVol(){
  muted = vol === 0;
  const b = $('soundBtn');
  b.querySelector('i').textContent = ['🔇', '🔉', '🔊'][vol];
  b.lastChild.textContent = ['音なし', '音 小', '音 大'][vol];
  if (MASTER) MASTER.gain.setTargetAtTime(VOLS[vol], AC.currentTime, 0.02);
}
// a pitched tone
function blip(f0, f1, t, dur, v, type, at){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f0, t); if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur*0.6);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (at || 0.006));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(MASTER); o.start(t); o.stop(t + dur + 0.05);
}
// a short burst of filtered noise: the "cardboard" part of a piece sound
function tap(t, freq, q, dur, v, kind){
  const s0 = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s0.buffer = NOISE; s0.playbackRate.value = 0.9 + Math.random()*0.2;
  f.type = kind || 'bandpass'; f.frequency.value = freq; f.Q.value = q;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s0.connect(f).connect(g).connect(MASTER);
  s0.start(t, Math.random()*0.3); s0.stop(t + dur + 0.02);
}
// a soft "shhh" that rises and falls (pieces sliding over the table)
function swish(t, dur, f0, f1, v){
  const s0 = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s0.buffer = NOISE; s0.loop = true;
  f.type = 'bandpass'; f.Q.value = 1.2;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + dur*0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s0.connect(f).connect(g).connect(MASTER); s0.start(t); s0.stop(t + dur + 0.02);
}
// a little bell (two partials) used for the chimes
function bell(f, t, v, dur){
  blip(f, f, t, dur || 0.7, v, 'sine', 0.004);
  blip(f*2.01, f*2.01, t, (dur || 0.7)*0.45, v*0.28, 'sine', 0.003);
}
const SCALE = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568, 1760]; // C major pentatonic, two octaves
let lastPick = 0;
function sound(kind, n){
  if (audioStale) ensureAudio();
  if (!AC || muted || !MASTER) return;
  try{
    const t = AC.currentTime + 0.005;
    if (kind === 'pick'){
      if (t - lastPick < 0.06) return; lastPick = t;
      tap(t, 2400, 1.4, 0.035, 0.22); blip(300, 260, t, 0.05, 0.05, 'triangle');
    } else if (kind === 'drop'){
      tap(t, 1100, 1.1, 0.06, 0.26); tap(t + 0.012, 2600, 2, 0.025, 0.08);
      blip(190, 150, t, 0.07, 0.07, 'triangle');
    } else if (kind === 'merge'){
      // "パチッ": two quick clicks and a woody knock
      tap(t, 3200, 1.8, 0.03, 0.42); tap(t + 0.028, 2000, 1.6, 0.04, 0.3);
      blip(620, 440, t, 0.11, 0.2, 'triangle'); blip(1240, 1240, t + 0.02, 0.12, 0.04);
    } else if (kind === 'lock'){
      // "カチッ" then a chime that climbs as the picture fills in
      tap(t, 3000, 1.6, 0.03, 0.4); tap(t + 0.025, 1500, 1.2, 0.05, 0.3);
      blip(520, 420, t, 0.09, 0.18, 'triangle');
      const k = Math.min(SCALE.length - 1, Math.floor((G ? G.locked/G.N : 0)*SCALE.length));
      bell(SCALE[k], t + 0.06, 0.13, 0.8);
      if ((n || 1) >= 4) bell(SCALE[Math.min(SCALE.length - 1, k + 2)], t + 0.15, 0.09, 0.9);
    } else if (kind === 'done'){
      // edge finished / colour finished: a short happy run
      [0, 2, 4, 5].forEach((j, i)=> bell(SCALE[j + 2], t + 0.25 + i*0.09, 0.11, 0.7));
    } else if (kind === 'milestone'){
      [7, 9].forEach((j, i)=> bell(SCALE[j], t + 0.2 + i*0.07, 0.06, 0.6));
    } else if (kind === 'shuffle'){
      for (let i = 0; i < 6; i++){
        const tt = t + i*0.07 + Math.random()*0.04;
        swish(tt, 0.16 + Math.random()*0.08, 1200 + Math.random()*800, 2600 + Math.random()*1200, 0.12);
        if (i % 2) tap(tt + 0.1, 1600 + Math.random()*800, 1.4, 0.03, 0.12);
      }
    } else if (kind === 'gather'){
      swish(t, 0.35, 900, 3000, 0.14); tap(t + 0.3, 2200, 1.4, 0.03, 0.14);
    } else if (kind === 'pop'){
      blip(500, 900, t, 0.08, 0.12, 'sine');
    } else if (kind === 'ui'){
      tap(t, 2800, 2, 0.025, 0.14);
    } else if (kind === 'clear'){
      // a little fanfare with a soft chord and twinkles
      const mel = [523.25, 659.25, 783.99, 1046.5, 987.77, 1046.5, 1318.5];
      const at = [0, 0.13, 0.26, 0.42, 0.62, 0.74, 0.92];
      mel.forEach((f, i)=> bell(f, t + at[i], 0.13, i === mel.length - 1 ? 1.6 : 0.6));
      [261.63, 329.63, 392, 523.25].forEach(f => blip(f, f, t + 0.92, 2.2, 0.05, 'triangle', 0.08));
      for (let i = 0; i < 14; i++) bell(1568 + Math.random()*1600, t + 1.1 + i*0.09 + Math.random()*0.05, 0.035, 0.4);
    }
  }catch(_){}
}

/* ---------- sample picture ---------- */
function makeSample(){
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');

  const horizon = H*0.6;
  let g = x.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#1d1a4f'); g.addColorStop(.35, '#5b2f7a'); g.addColorStop(.62, '#c4507a'); g.addColorStop(.85, '#f49a5c'); g.addColorStop(1, '#ffd88c');
  x.fillStyle = g; x.fillRect(0, 0, W, horizon);
  for (let i = 0; i < 160; i++){
    const sy = rnd()*horizon*0.45;
    x.fillStyle = `rgba(255,255,255,${(1 - sy/(horizon*0.45))*0.9*rnd()})`;
    x.beginPath(); x.arc(rnd()*W, sy, rnd()*1.8 + .4, 0, 7); x.fill();
  }
  x.fillStyle = '#fff6d8'; x.beginPath(); x.arc(W*0.18, H*0.13, 34, 0, 7); x.fill();
  x.fillStyle = '#5b2f7a'; x.beginPath(); x.arc(W*0.18 + 14, H*0.13 - 8, 30, 0, 7); x.fill();
  const sx = W*0.64, sy = horizon - 40;
  g = x.createRadialGradient(sx, sy, 20, sx, sy, 420);
  g.addColorStop(0, 'rgba(255,240,180,.9)'); g.addColorStop(.3, 'rgba(255,200,120,.35)'); g.addColorStop(1, 'rgba(255,180,120,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, horizon);
  x.fillStyle = '#fff1bf'; x.beginPath(); x.arc(sx, sy, 105, 0, 7); x.fill();
  for (let i = 0; i < 7; i++){
    const cx = rnd()*W, cy = H*0.12 + rnd()*H*0.3, cw = 140 + rnd()*260;
    x.fillStyle = `rgba(${240 - i*6},${150 + i*8},${170},${.35 + rnd()*.25})`;
    x.beginPath(); x.ellipse(cx, cy, cw, 16 + rnd()*14, 0, 0, 7); x.fill();
    x.beginPath(); x.ellipse(cx + cw*0.3, cy - 12, cw*0.45, 14, 0, 0, 7); x.fill();
  }
  function ridge(base, amp, color, f){
    x.fillStyle = color; x.beginPath(); x.moveTo(0, horizon + 2);
    for (let px = 0; px <= W; px += 8){
      const y = base - amp*(0.55*Math.sin(px*0.004*f + f) + 0.3*Math.sin(px*0.011*f + 2*f) + 0.15*Math.sin(px*0.03 + f));
      x.lineTo(px, y);
    }
    x.lineTo(W, horizon + 2); x.closePath(); x.fill();
  }
  ridge(horizon - 70, 90, '#8a4a7e', 1.1);
  ridge(horizon - 20, 70, '#5e3266', 1.7);
  g = x.createLinearGradient(0, horizon, 0, H*0.82);
  g.addColorStop(0, '#f6b073'); g.addColorStop(.25, '#c66f7c'); g.addColorStop(1, '#2d2f6b');
  x.fillStyle = g; x.fillRect(0, horizon, W, H*0.82 - horizon);
  for (let i = 0; i < 90; i++){
    const yy = horizon + 6 + Math.pow(rnd(), 1.4)*(H*0.22);
    const spread = 40 + (yy - horizon)*1.4;
    const lx = sx + (rnd() - .5)*spread*2;
    x.strokeStyle = `rgba(255,236,170,${0.75 - (yy - horizon)/(H*0.3)})`; x.lineWidth = 2 + rnd()*2;
    x.beginPath(); x.moveTo(lx, yy); x.lineTo(lx + 20 + rnd()*50, yy); x.stroke();
  }
  // little sailboat
  const bx = W*0.3, by = horizon + 110;
  x.fillStyle = '#2a1f45'; x.beginPath(); x.moveTo(bx - 60, by); x.lineTo(bx + 60, by); x.lineTo(bx + 42, by + 18); x.lineTo(bx - 44, by + 18); x.fill();
  x.fillStyle = '#fbe6d2'; x.beginPath(); x.moveTo(bx - 4, by - 4); x.lineTo(bx - 4, by - 130); x.lineTo(bx - 70, by - 6); x.fill();
  x.fillStyle = '#f2b38f'; x.beginPath(); x.moveTo(bx + 4, by - 4); x.lineTo(bx + 4, by - 105); x.lineTo(bx + 52, by - 6); x.fill();
  // birds
  x.strokeStyle = 'rgba(40,20,50,.75)'; x.lineWidth = 3;
  for (let i = 0; i < 6; i++){
    const qx = W*0.72 + rnd()*300, qy = H*0.18 + rnd()*160, q = 10 + rnd()*10;
    x.beginPath(); x.moveTo(qx - q, qy); x.quadraticCurveTo(qx - q/2, qy - q*0.6, qx, qy); x.quadraticCurveTo(qx + q/2, qy - q*0.6, qx + q, qy); x.stroke();
  }

  g.addColorStop(0, '#3e6b4f'); g.addColorStop(1, '#16301f');
  x.fillStyle = g; x.beginPath(); x.moveTo(0, my);
  for (let px = 0; px <= W; px += 10) x.lineTo(px, my - 30*Math.sin(px*0.003 + 1) - 14*Math.sin(px*0.013));
  x.lineTo(W, H); x.lineTo(0, H); x.fill();
  const fc = ['#ffd1dc', '#ffe48a', '#ffffff', '#b9c8ff', '#ff9fb2', '#ffc27a'];
  for (let i = 0; i < 900; i++){
    const yy = my + Math.pow(rnd(), 0.8)*(H - my);
    const size = 2 + (yy - my)/(H - my)*9*rnd() + 1;
    const fx = rnd()*W;
    x.strokeStyle = 'rgba(30,70,40,.7)'; x.lineWidth = 1.5;
    x.beginPath(); x.moveTo(fx, yy); x.lineTo(fx + (rnd() - .5)*4, yy + size*2.2); x.stroke();
    x.fillStyle = fc[Math.floor(rnd()*fc.length)];
    x.beginPath(); x.arc(fx, yy, size, 0, 7); x.fill();
    if (size > 6){ x.fillStyle = '#f7c948'; x.beginPath(); x.arc(fx, yy, size*0.35, 0, 7); x.fill(); }

/* ---------- bit pictures ---------- */
const MONO = '"DejaVu Sans Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace';
function seeded(seed){ return ()=>{ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hsv(h, s, v){
  const i = Math.floor(h*6), f = h*6 - i, p = v*(1-s), q = v*(1-f*s), t = v*(1-(1-f)*s);
  const [r, g, b] = [[v,t,p],[q,v,p],[p,v,t],[p,q,v],[t,p,v],[v,p,q]][i % 6];
  return [Math.round(r*255), Math.round(g*255), Math.round(b*255)];
}
const hx2 = n => n.toString(16).toUpperCase().padStart(2, '0');

function makeHexColors(){
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#111'; x.fillRect(0, 0, W, H);
  const cols = 12, rows = 10, cw = W/cols, ch = H/rows;
  x.font = `bold 22px ${MONO}`; x.textAlign = 'center'; x.textBaseline = 'middle';
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++){
    const s = r < 5 ? 0.35 + r*0.16 : 1, v = r < 5 ? 1 : 1 - (r-5)*0.16;
    const [R, G, B] = hsv(k/cols, Math.min(1, s), v);
    x.fillStyle = `rgb(${R},${G},${B})`;
    x.fillRect(k*cw + 3, r*ch + 3, cw - 6, ch - 6);
    const lum = 0.299*R + 0.587*G + 0.114*B;
    x.fillStyle = lum > 140 ? '#141414' : '#f5f5f5';
    x.fillText('#' + hx2(R) + hx2(G) + hx2(B), k*cw + cw/2, r*ch + ch/2);
  }
  return c;
}

function makeRocket(){
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), rnd = seeded(7);

  const pal = [[255,90,90],[255,150,60],[255,210,60],[120,220,90],[60,200,200],[80,140,255],[170,110,255],[255,110,200]];
  x.fillStyle = 'rgb(18,20,48)'; x.fillRect(0, 0, W, H);
  for (let i = 0; i < 220; i++){
    const sx = rnd()*W, sy = rnd()*H, b = 90 + Math.floor(rnd()*165);
    x.fillStyle = rnd() < 0.15 ? `rgb(${b},${b},255)` : `rgb(${b},${b},${b})`;
    const z = rnd() < 0.2 ? 3 : 1.5; x.fillRect(sx, sy, z, z);

  sprite.forEach((n, r)=>{

      const x0 = ox + k*cell, y0 = oy + r*cell;

}

function makeBinaryMoon(){
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), rnd = seeded(3);
  x.fillStyle = 'rgb(4,10,24)'; x.fillRect(0, 0, W, H);
  x.font = `bold 17px ${MONO}`; x.textBaseline = 'top';
  const cx = 1060, cy = 400, R = 280, sea = H*0.72;
  for (let y = 0; y < H; y += 20) for (let px = 0; px < W; px += 14){
    const bit = rnd() < 0.5 ? '0' : '1';
    const dist = Math.hypot(px - cx, y - cy), inner = Math.hypot(px - (cx + 150), y - cy + 40);
    let col;
    if (dist < R && inner > R*0.9){
      const t = dist/R; col = `rgb(255,${235 - 40*t | 0},${140 - 60*t | 0})`;
    } else if (y > sea){
      const t = (y - sea)/(H - sea);
      const wave = Math.abs(px - cx) < 140 - 80*t && rnd() < 0.7;
      col = wave ? 'rgb(255,210,120)' : `rgb(20,${110 + 80*t | 0},${170 + 60*t | 0})`;
    } else {
      const t = y/sea;
      col = rnd() < 0.012 ? 'rgb(240,240,255)' : `rgb(${30 + 60*t | 0},${40 + 60*t | 0},${110 + 60*t | 0})`;
    }
    x.fillStyle = col; x.fillText(bit, px, y);
  }
  return c;
}

function makeHexSunset(){
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), rnd = seeded(11);
  x.fillStyle = '#0b0618'; x.fillRect(0, 0, W, H);
  x.font = `bold 20px ${MONO}`; x.textBaseline = 'top';
  const sx = 800, sy = 470, SR = 230, horizon = 720;
  const ridge = (px, b, a, f)=> b - a*(0.6*Math.sin(px*0.004*f + f) + 0.3*Math.sin(px*0.011*f + 2*f) + 0.1*Math.sin(px*0.04 + f));
  const lerp = (a, b, t)=> a.map((v, i)=> Math.round(v + (b[i] - v)*t));
  const sky = [[40,20,90],[120,40,140],[230,70,120],[255,140,80],[255,210,120]];
  for (let y = 0; y < H; y += 24) for (let px = 0; px < W; px += 30){
    const byte = hx2(Math.floor(rnd()*256));
    let col;
    const r1 = ridge(px, horizon - 110, 90, 1.3), r2 = ridge(px, horizon - 30, 60, 2.1);
    const sun = Math.hypot(px + 12 - sx, y + 10 - sy);
    if (y > horizon){
      const t = (y - horizon)/(H - horizon);
      const glow = Math.abs(px - sx) < (SR*0.9)*(1 - t*0.5) && (Math.floor(y/24) % 2 === 0 || rnd() < 0.5);
      col = glow ? lerp([255,230,140],[255,110,120], t) : lerp([60,120,200],[30,30,90], t);
    } else if (y > r2) col = [60,190,200];
    else if (y > r1) col = [150,90,230];
    else if (sun < SR){
      // sun with stripes like a retro synth sun
      const stripe = y > sy && Math.floor((y - sy)/24) % 2 === 1;
      col = stripe ? [255,90,120] : lerp([255,240,150],[255,120,90], (y - (sy - SR))/(2*SR));
    } else {
      const t = Math.min(1, y/horizon)*(sky.length - 1), i = Math.min(sky.length - 2, Math.floor(t));
      col = lerp(sky[i], sky[i+1], t - i);
      if (rnd() < 0.01 && y < 260) col = [255,255,255];
    }
    x.fillStyle = `rgb(${col})`; x.fillText(byte, px, y);
  }
  return c;
}

function makeBinaryAurora(){
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), rnd = seeded(21);
  x.fillStyle = '#02060f'; x.fillRect(0, 0, W, H);
  x.font = `bold 16px ${MONO}`; x.textBaseline = 'top';
  const bands = [
    {y:520, a:110, f:0.0042, ph:0.3, w:150, col:[80,255,170]},
    {y:640, a:80, f:0.0057, ph:2.1, w:110, col:[90,200,255]},
    {y:400, a:70, f:0.0033, ph:4.0, w:120, col:[230,110,255]},
  ];
  const lake = 860;
  const sky = (px, y)=>{
    let r = 10, g = 18, b = 46 + y/H*20, lit = 0;
    for (const B of bands){
      const cy = B.y + B.a*Math.sin(px*B.f + B.ph) + 30*Math.sin(px*0.013 + B.ph);
      const d = y - cy;
      // curtains: bright at the bottom edge, fading upward
      const k = d < 0 ? Math.exp(d/B.w) : Math.exp(-d*d/300);
      const ray = 0.55 + 0.45*Math.sin(px*0.08 + B.ph*3);
      const s = Math.max(0, k*ray)*2.2;
      r += B.col[0]*s; g += B.col[1]*s; b += B.col[2]*s; lit += s;
    }
    return [r, g, b, lit];
  };
  for (let y = 0; y < H; y += 18) for (let px = 0; px < W; px += 12){
    const bit = rnd() < 0.5 ? '0' : '1';
    const hill = lake - 40 - 70*Math.max(0, Math.sin(px*0.004 + 1)) - 25*Math.sin(px*0.013);
    let r, g, b, lit;
    if (y > lake){
      // the lake mirrors the sky, a little darker and wavy
      const my = 2*lake - y + 8*Math.sin(y*0.3 + px*0.02);
      [r, g, b, lit] = sky(px, my);
      r *= 0.55; g *= 0.6; b *= 0.7;
    } else if (y > hill){ r = 20; g = 45; b = 70; lit = 1; }
    else {
      [r, g, b, lit] = sky(px, y);
      if (lit < 0.08 && rnd() < 0.02){ r = g = b = 235; }
    }
    x.fillStyle = `rgb(${Math.min(255, r|0)},${Math.min(255, g|0)},${Math.min(255, b|0)})`;
    x.fillText(bit, px, y);
  }
  return c;
}

function makeHexMandala(){
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  x.fillStyle = '#100a1c'; x.fillRect(0, 0, W, H);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  const cx = W/2, cy = H/2;
  // rings of hex digits; petals come from a 12-fold pattern
  for (let ring = 0; ring < 30; ring++){
    const R = 18 + ring*24;
    const n = Math.max(6, Math.round(2*Math.PI*R/22));
    const fs = 14 + Math.min(10, ring*0.4);
    x.font = `bold ${fs|0}px ${MONO}`;
    for (let i = 0; i < n; i++){
      const a = i/n*Math.PI*2;
      const petal = Math.cos(a*12)*0.5 + 0.5, petal2 = Math.cos(a*6 + ring*0.35)*0.5 + 0.5;
      const v = (ring*7 + Math.round(petal*15)) % 16;
      const hue = (a/(Math.PI*2) + ring*0.03) % 1;
      const sat = 0.55 + 0.45*petal, val = 0.45 + 0.55*Math.max(petal, petal2);
      const [r, g, b] = hsv(hue, sat, val);
      const px = cx + Math.cos(a)*R, py = cy + Math.sin(a)*R;
      if (px < -20 || px > W + 20 || py < -20 || py > H + 20) continue;
      x.save(); x.translate(px, py); x.rotate(a + Math.PI/2);
      x.fillStyle = `rgb(${r},${g},${b})`;
      x.fillText(v.toString(16).toUpperCase(), 0, 0);
      x.restore();
    }
  }
  return c;
}

function makeXorPattern(){
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const cell = 25, cols = W/cell, rows = H/cell;
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `bold 11px ${MONO}`;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++){
    const v = (k ^ r) & 63;               // the XOR of column and row
    const [R, G, B] = hsv((v/64 + 0.55) % 1, 0.75, 0.35 + 0.65*((v & 7)/7));
    x.fillStyle = `rgb(${R},${G},${B})`;
    x.fillRect(k*cell, r*cell, cell, cell);
    const lum = 0.299*R + 0.587*G + 0.114*B;
    x.fillStyle = lum > 130 ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.6)';
    x.fillText(hx2(v), k*cell + cell/2, r*cell + cell/2 + 1);
  }
  return c;
}

/* ---------- seasons & times of day (drawn with 0/1 or hex digits) ---------- */
function bitScene(opt){
  const W = 1600, H = 1200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d'), rnd = seeded(opt.seed);
  x.fillStyle = opt.bg; x.fillRect(0, 0, W, H);
  x.font = `bold ${opt.fs}px ${MONO}`; x.textBaseline = 'top';
  const glyph = opt.hex ? ()=> hx2(Math.floor(rnd()*256)) : ()=> rnd() < 0.5 ? '0' : '1';
  for (let y = 0; y < H; y += opt.dy) for (let px = 0; px < W; px += opt.dx){
    const g = glyph(), col = opt.color(px, y, rnd);
    if (!col) continue;
    if (opt.fill){ const f = opt.fill; x.fillStyle = `rgb(${col[0]*f|0},${col[1]*f|0},${col[2]*f|0})`; x.fillRect(px, y, opt.dx, opt.dy); }
    x.fillStyle = `rgb(${col[0]|0},${col[1]|0},${col[2]|0})`; x.fillText(g, px, y);
  }
  return c;
}
const mix = (a, b, t)=> a.map((v, i)=> v + (b[i] - v)*Math.max(0, Math.min(1, t)));
const grad = (stops, t)=>{
  t = Math.max(0, Math.min(1, t))*(stops.length - 1);
  const i = Math.min(stops.length - 2, Math.floor(t));
  return mix(stops[i], stops[i+1], t - i);
};
const wave = (px, base, amp, f, ph)=> base - amp*(0.6*Math.sin(px*0.004*f + ph) + 0.3*Math.sin(px*0.011*f + 2*ph) + 0.1*Math.sin(px*0.04 + ph));
const blob = (px, y, cx, cy, rx, ry)=> ((px - cx)/rx)**2 + ((y - cy)/ry)**2;

function makeSpring(){
  // cherry trees on a green hill, petals in the air
  const trees = [[330, 520, 260, 190], [900, 470, 300, 210], [1380, 560, 230, 170]];
  return bitScene({seed:31, bg:'#0d1420', fs:16, dx:13, dy:18, color:(px, y, rnd)=>{
    const hill = wave(px, 860, 60, 0.8, 1.2);
    for (const [cx, cy, rx, ry] of trees){
      const d = blob(px, y, cx, cy, rx, ry) + 0.25*Math.sin(px*0.05)*Math.sin(y*0.05);
      if (d < 1) return mix([255,215,230], [235,120,170], d + rnd()*0.25);
      if (Math.abs(px - cx) < 24 && y > cy && y < hill + 10) return [110,70,70];
    }
    if (y > hill) return grad([[150,220,120],[70,150,80],[40,90,60]], (y - hill)/(1200 - hill));
    if (rnd() < 0.03) return [255,190,215];          // falling petals
    return grad([[150,200,255],[200,225,255],[245,235,245]], y/hill);
  }});
}

function makeSummer(){
  // deep blue sky, a towering cloud, the sea and a white beach
  return bitScene({seed:32, bg:'#06122a', fs:16, dx:13, dy:18, color:(px, y, rnd)=>{
    const sea = 700, beach = wave(px, 1000, 30, 0.6, 0.4);
    const cloud = Math.min(blob(px, y, 1000, 470, 300, 230), blob(px, y, 780, 560, 230, 150),
                           blob(px, y, 1230, 560, 220, 140), blob(px, y, 1010, 300, 190, 170));
    if (y < sea && cloud < 1) return mix([255,255,255], [190,205,230], (y - 250)/450);
    if (Math.hypot(px - 250, y - 180) < 90) return [255,250,200];
    if (y < sea) return grad([[20,80,220],[60,150,255],[150,210,255]], y/sea);
    if (y > beach) return mix([255,240,200], [240,215,160], rnd()*0.4);
    const t = (y - sea)/(beach - sea);
    if (Math.sin(px*0.03 + y*0.2) > 0.93) return [230,250,255];   // sparkles on the sea
    return grad([[40,170,230],[20,130,200],[60,210,210]], t);
  }});
}

function makeAutumn(){
  // red, orange and yellow trees on a hill under an evening sky
  const trees = [[220, 640, 170, 150, 0], [560, 600, 190, 170, 1], [930, 640, 170, 150, 2], [1260, 590, 200, 170, 0], [1520, 660, 140, 130, 1]];
  const cols = [[240,70,50], [255,150,40], [255,215,70]];
  return bitScene({seed:33, bg:'#120a0a', fs:16, dx:13, dy:18, color:(px, y, rnd)=>{
    const hill = wave(px, 860, 40, 0.8, 2.0);
    for (const [cx, cy, rx, ry, k] of trees){
      const d = blob(px, y, cx, cy, rx, ry) + 0.2*Math.sin(px*0.06)*Math.sin(y*0.07);
      if (d < 1) return mix(cols[k], [150,40,40], d*0.5 + rnd()*0.2);
      if (Math.abs(px - cx) < 18 && y > cy && y < hill + 10) return [110,60,40];
    }
    if (y > hill){
      if (rnd() < 0.08) return cols[Math.floor(rnd()*3)];   // leaves on the ground
      return grad([[200,120,50],[130,70,40]], (y - hill)/(1200 - hill));
    }
    if (rnd() < 0.02) return cols[Math.floor(rnd()*3)];     // falling leaves
    return grad([[90,60,160],[220,110,140],[255,190,110]], y/hill);
  }});
}

function makeWinter(){
  // snowy mountains under a pale sky, snow falling
  return bitScene({seed:34, bg:'#0a1220', fs:16, dx:13, dy:18, color:(px, y, rnd)=>{
    const peak = 520 + 260*Math.abs(Math.sin(px*0.0028 + 0.6)) - 40*Math.sin(px*0.013);
    const snowline = peak + 90 + 30*Math.sin(px*0.02);
    const ground = wave(px, 960, 25, 0.7, 1.6);
    if (rnd() < 0.05) return [255,255,255];             // falling snow
    if (y > ground) return mix([240,248,255], [200,220,240], (y - ground)/240);
    if (y > snowline) return grad([[90,120,160],[60,85,120]], (y - snowline)/(ground - snowline));
    if (y > peak) return [235,242,255];
    return grad([[120,150,200],[190,210,235],[230,235,245]], y/700);
  }});
}

function makeMorning(){
  // the sun coming up over a calm sea, hex bytes
  return bitScene({seed:35, bg:'#120c1c', fs:18, dx:24, dy:21, hex:true, color:(px, y, rnd)=>{
    const sea = 720, sun = Math.hypot(px + 10 - 800, y + 9 - 620);
    if (y < sea && sun < 150) return mix([255,235,120], [255,120,50], sun/150);
    if (y < sea){
      const glow = Math.max(0, 1 - sun/700);
      return mix(grad([[120,150,230],[230,170,210],[255,200,150]], y/sea), [255,220,170], glow*0.3);
    }
    const t = (y - sea)/480, road = Math.abs(px - 800) < 160*(1 - t*0.4) && rnd() < 0.75;
    return road ? mix([255,235,170], [255,180,140], t) : grad([[150,140,190],[80,90,150]], t);
  }});
}

function makeNoon(){
  // a bright summer-green field under a high sun
  return bitScene({seed:36, bg:'#0b1a10', fs:16, dx:13, dy:18, color:(px, y, rnd)=>{
    const ground = wave(px, 700, 50, 0.9, 0.3);
    const clouds = Math.min(blob(px, y, 350, 280, 180, 60), blob(px, y, 1250, 220, 220, 70), blob(px, y, 800, 380, 140, 45));
    if (Math.hypot(px - 800, y - 120) < 80) return [255,255,230];

/* ---------- toy-brick primaries & Japanese traditional colours ---------- */
const TOY = [[40,110,235], [232,52,45], [252,192,18], [36,165,72]];   // blue, red, yellow, green

function makeBrickHill(){
  // a hill of stacked toy bricks (running bond), studs on the top row
  const BW = 104, BH = 72;                       // 8 x 4 glyph cells per brick
  const top = px => 1200 - (520 + 300*Math.sin(px/1600*Math.PI) + 60*Math.sin(px*0.01));
  return bitScene({seed:41, bg:'#05060c', fill:0.5, fs:16, dx:13, dy:18, color:(px, y, rnd)=>{
    const row = Math.floor((1200 - y)/BH), off = row % 2 ? BW/2 : 0;
    const col = Math.floor((px + off)/BW), bx = col*BW - off;
    const yTop = 1200 - (row + 1)*BH;
    const filled = yTop + BH/2 > top(bx + BW/2);
    if (filled){
      const k = TOY[((col*3 + row*5) % 4 + 4) % 4];
      const lx = px - bx, ly = y - yTop;
      if (lx < 13 || ly > BH - 19) return k.map(v => v*0.55);            // brick seams
      return ly < 18 ? k.map(v => Math.min(255, v + 50)) : k;            // lighter top edge
    }
    // studs sitting on the top bricks
    const below = Math.floor((1200 - (y + BH))/BH);
    if (rnd() < 0.015) return [255,255,255];
    return grad([[20,40,90],[60,110,190],[150,200,255]], y/900);
  }});
}

function makeToyDots(){
  // big and small polka dots in four toy colours, written in hex
  const r0 = seeded(5), dots = [];
  for (let i = 0; i < 60; i++){
    const r = 30 + Math.pow(r0(), 2.2)*190, cx = r0()*1600, cy = r0()*1200;
    if (dots.some(([x2, y2, r2]) => Math.hypot(cx - x2, cy - y2) < r + r2 + 14)) continue;
    dots.push([cx, cy, r, TOY[i % 4]]);
  }
  return bitScene({seed:42, bg:'#06070d', fs:18, dx:24, dy:21, hex:true, color:(px, y, rnd)=>{
    for (const [cx, cy, r, k] of dots){
      const d = Math.hypot(px + 11 - cx, y + 10 - cy);
      if (d < r) return k.map(v => Math.min(255, v + 70*(1 - d/r)*(px < cx && y < cy ? 1 : 0.3)));
    }
    return rnd() < 0.5 ? [28,30,44] : null;
  }});
}

function makeWaMountains(){

function makeWaVillage(){

function makeWaSakuraRiver(){
  // a river winding into the distance, rows of cherry trees on both banks, petals on the water
  const H0 = 500;
  const rc = y => 800 + 220*Math.sin((y - H0)*0.005 + 0.6);         // river centre
  const rw = y => 18 + (y - H0)*0.34;                                 // river half width
  const trees = [];
  for (const y of [520, 560, 615, 690, 790, 920, 1080]){
    const r = 22 + (y - H0)*0.26;
    trees.push([rc(y) - rw(y) - r*0.9 - 10, y - r*0.55, r*1.15, r*0.8, r]);
    trees.push([rc(y) + rw(y) + r*0.9 + 10, y - r*0.55, r*1.15, r*0.8, r]);
  }
  trees.sort((a, b)=> b[1] - a[1]);                                   // nearest first
  return bitScene({seed:51, bg:'#0c0a0d', fill:0.62, fs:16, dx:13, dy:18, color:(px, y, rnd)=>{
    for (const [cx, cy, rx, ry, r] of trees){
      const d = blob(px, y, cx, cy, rx, ry) + 0.2*Math.sin(px*0.06)*Math.sin(y*0.05);
      if (d < 1) return mix(WA.sakura, WA.kobai, d*0.9 + rnd()*0.25);
      if (Math.abs(px - cx) < 4 + r*0.07 && y > cy && y < cy + ry*1.4) return [96,62,58];
    }
    if (y > H0){
      const t = (y - H0)/(1200 - H0);
      if (Math.abs(px - rc(y)) < rw(y)){
        if (rnd() < 0.035) return WA.sakura;                             // petals floating
        if (Math.sin(px*0.05 + y*0.15) > 0.97) return WA.kinari;           // ripples
        return mix(WA.asagi, WA.ai, t*0.6);
      }
      if (Math.abs(px - rc(y)) < rw(y) + 8 + t*14) return WA.kareno;      // the bank
      if (rnd() < 0.025) return WA.kobai;                                 // petals on the grass
      return mix(WA2.wakakusa, WA.wakatake, t);
    }
    if (y > wave(px, 470, 40, 1.1, 1.7)) return mix(WA.fuji, WA.kinari, 0.25);
    if (rnd() < 0.015) return WA.kobai;
    return grad([[200,220,240], WA.sakura, WA.kinari], y/H0);
  }});
}

function makeWaTerraceDusk(){

function makeWaBambooPath(){

  for (let i = 0; i < 26; i++){

    stalks.push([x, near ? 22 + r0()*14 : 6 + r0()*8, near, r0()*120]);
  }
  stalks.sort((a, b)=> b[1] - a[1]);                                   // widest (nearest) first
  return bitScene({seed:55, bg:'#060a05', fill:0.6, fs:16, dx:13, dy:18, color:(px, y, rnd)=>{
    const vp = 520, pc = 800 + 70*Math.sin((y - vp)*0.004), ax = Math.abs(px - pc);
    const onPath = y > vp && ax < 10 + (y - vp)*0.5;
    for (const [sx, w, near, ph] of stalks){
      if (!near && onPath) continue;                                   // far stalks stand behind the path
      if (!near && y > vp + 40 + Math.abs(sx - 800)*0.15) continue;
      if (Math.abs(px - sx) < w){
        if ((y + ph) % 130 < 10) return mix(WA.uguisu, WA2.koke, 0.5);  // the joints
        const edge = Math.abs(px - sx)/w;

    if (y < 260 && rnd() < 0.35) return mix(WA.moegi, WA2.wakakusa, rnd());   // leaves overhead
    if (onPath){
      const t = (y - vp)/(1200 - vp), sz = 30 + t*90;
      const row = Math.floor((y - vp)/sz*1.6), off = row % 2 ? sz/2 : 0;
      const seam = ((px - pc + off + 2000) % sz) < 6 + t*6 || ((y - vp) % (sz/1.6)) < 4 + t*5;
      return seam ? WA2.koke.map(v => v*0.7) : mix(WA2.rikyu, WA.kinari, 0.15 + t*0.25 + rnd()*0.15);
    }
    if (y > vp) return mix(WA2.koke, [50,70,30], rnd()*0.4);           // moss beside the path
    const ray = Math.max(0, Math.sin(px*0.006 - y*0.004 + 1.2));       // shafts of light
    return mix([30,60,30], [230,240,190], ray**6*0.6 + y/vp*0.15);
  }});
