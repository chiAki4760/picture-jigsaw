/* ---------- ぐるぐる模様 ---------- */
function canvasDark(bg){
  const c = document.createElement('canvas'); c.width = 1600; c.height = 1200;
  const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, 1600, 1200);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  return [c, x];
}
function glyphAt(x, ch, px, py, rot, size, rgb){
  x.save(); x.translate(px, py); x.rotate(rot);
  x.font = `bold ${size|0}px ${MONO}`; x.fillStyle = `rgb(${rgb})`; x.fillText(ch, 0, 0);
  x.restore();
}

function makeBinarySpiral(){
  // five arms of 0s and 1s winding out from the middle, the colour turning like a rainbow
  const [c, x] = canvasDark('#0a0714'), rnd = seeded(61);
  const cx = 800, cy = 600, arms = 3, b = 62;
  for (let k = 0; k < arms; k++){
    for (let th = 0.6; b*th < 1050; ){
      const r = b*th, size = 11 + r*0.03, ang = th + k/arms*Math.PI*2;
      const px = cx + Math.cos(ang)*r, py = cy + Math.sin(ang)*r;
      // a few strands side by side make each arm a ribbon
      for (let j = -2; j <= 2; j++){
        const rr = r + j*size*1.05;
        const qx = cx + Math.cos(ang)*rr, qy = cy + Math.sin(ang)*rr;
        const rgb = hsv((k/arms + r/1600 + j*0.02 + 1) % 1, 0.8, 0.95 - Math.abs(j)*0.18);
        glyphAt(x, rnd() < 0.5 ? '0' : '1', qx, qy, ang + Math.PI/2, size, rgb);
      }
      th += size*0.85/r;
    }
  }
  return c;
}

function makeHexSunflower(){
  // sunflower seeds placed by the golden angle; each seed is its own number in hex
  const [c, x] = canvasDark('#0d0a06');
  const cx = 800, cy = 600, GA = Math.PI*(3 - Math.sqrt(5));
  for (let n = 1; n < 4200; n++){
    const r = 15.5*Math.sqrt(n), th = n*GA;
    const px = cx + Math.cos(th)*r, py = cy + Math.sin(th)*r;
    if (px < -20 || px > 1620 || py < -20 || py > 1220) continue;
    // the 21 and 34 spirals show up as stripes of colour
    const rgb = hsv(((n % 34)/34 + r/2400) % 1, 0.8, 0.98 - 0.25*(n % 21 < 4 ? 1 : 0));
    glyphAt(x, hx2(n & 255), px, py, th, 15, rgb);
  }
  return c;
}

function makeMoireRings(){
  // two sets of rings laid over each other: where they cross, new patterns appear
  return bitScene({seed:62, bg:'#05040c', fill:0.55, fs:16, dx:13, dy:18, color:(px, y)=>{
    const d1 = Math.hypot(px - 560, y - 560), d2 = Math.hypot(px - 1040, y - 640);
    const k = (Math.floor(d1/34) + Math.floor(d2/34)) % 2;
    const hue = ((d1 + d2)/1800 + (k ? 0.5 : 0)) % 1;
    return hsv(hue, k ? 0.8 : 0.55, k ? 0.95 : 0.35);
  }});
}

function makeHexKaleido(){
  // an eight-fold kaleidoscope: the same little pattern folded round the centre, in hex
  return bitScene({seed:63, bg:'#08050f', fill:0.6, fs:18, dx:24, dy:21, hex:true, color:(px, y)=>{
    const dx = px + 12 - 800, dy = y + 10 - 600, r = Math.hypot(dx, dy);
    let a = Math.atan2(dy, dx), seg = Math.PI/4;
    a = Math.abs(((a % seg) + seg) % seg - seg/2);                     // fold into one slice
    const u = r*Math.cos(a)/90, v = r*Math.sin(a)/90;
    const f = Math.sin(u*2.1) + Math.cos(v*3.3 + u) + Math.sin(r/70);
    const hue = (r/900 + f*0.08 + 0.6) % 1;
    return hsv(hue, 0.7 + 0.3*Math.sin(f*2)**2, 0.35 + 0.65*Math.abs(Math.sin(f*1.6)));
  }});
}

function makeBinaryVortex(){
  // a whirlpool: colours twist more and more toward the eye
  return bitScene({seed:64, bg:'#020611', fill:0.55, fs:16, dx:13, dy:18, color:(px, y)=>{
    const dx = px - 800, dy = y - 600, r = Math.hypot(dx, dy) + 1;
    const a = Math.atan2(dy, dx) + 2.6*Math.log(r/20);
    const arms = Math.sin(a*6), t = Math.max(0, Math.min(1, r/850));
    const rgb = hsv((a/(Math.PI*2)*2 % 1 + 1) % 1, 0.75, 0.25 + 0.75*(arms*0.5 + 0.5)*(1 - t*0.5));
    if (r < 16) return [255,255,255];
    return rgb;
  }});
}

function makeBitSpirograph(){
  // spirograph curves drawn with 0s and 1s, one colour per ring
  const [c, x] = canvasDark('#07070f'), rnd = seeded(65);
  const cx = 800, cy = 600;
  const curves = [[500, 140, 200, 0.95], [360, 96, 150, 0.12], [240, 90, 110, 0.55], [130, 52, 60, 0.3]];
  curves.forEach(([R, r, d, hue])=>{
    const k = (R - r)/r, turns = r/gcd(R, r)*Math.PI*2;
    let lx = -99, ly = -99;
    for (let t = 0; t < turns; t += 0.002){
      const px = cx + (R - r)*Math.cos(t) + d*Math.cos(k*t);
      const py = cy + (R - r)*Math.sin(t) - d*Math.sin(k*t);
      if (Math.hypot(px - lx, py - ly) < 11) continue;
      lx = px; ly = py;
      const rgb = hsv((hue + t/turns*0.3) % 1, 0.75, 0.95);
      glyphAt(x, rnd() < 0.5 ? '0' : '1', px, py, t, 12, rgb);
    }
  });
  return c;
}
function gcd(a, b){ return b ? gcd(b, a % b) : a; }

/* ---------- ブラウン管テレビ ---------- */
function plainCanvas(){ const c = document.createElement('canvas'); c.width = 1600; c.height = 1200; return [c, c.getContext('2d')]; }
// turn an ordinary drawing into 0/1 (or hex) digits, sampled cell by cell
function toBits(draw, opt){
  const [p, q] = plainCanvas(); draw(q);
  const d = q.getImageData(0, 0, 1600, 1200).data;
  return bitScene(Object.assign({seed:70, bg:'#000', fill:0.7, fs:16, dx:13, dy:18}, opt, {color:(px, y, rnd)=>{
    const sx = Math.min(1599, px + 6), sy = Math.min(1199, y + 9), i = (sy*1600 + sx)*4;
    return opt.tweak ? opt.tweak([d[i], d[i+1], d[i+2]], px, y, rnd) : [d[i], d[i+1], d[i+2]];
  }}));
}
// scan lines, a dark rounded glass edge and the plastic frame of an old TV
function crtFinish(c){
  const x = c.getContext('2d'), W = 1600, H = 1200;
  x.fillStyle = 'rgba(0,0,0,.16)';
  for (let y = 0; y < H; y += 5) x.fillRect(0, y, W, 2);
  let g = x.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  g = x.createLinearGradient(0, 0, W*0.6, H*0.6);
  g.addColorStop(0, 'rgba(255,255,255,.10)'); g.addColorStop(0.5, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // frame: everything outside a rounded screen
  const m = 46, r = 120;
  x.save();
  x.beginPath(); x.rect(0, 0, W, H);
  x.moveTo(m + r, m); x.arcTo(m, m, m, m + r, r); x.arcTo(m, H - m, m + r, H - m, r);
  x.arcTo(W - m, H - m, W - m, H - m - r, r); x.arcTo(W - m, m, W - m - r, m, r); x.closePath();
  g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5a4a3c'); g.addColorStop(1, '#2e241c');
  x.fillStyle = g; x.fill('evenodd');
  x.restore();
  x.strokeStyle = 'rgba(0,0,0,.6)'; x.lineWidth = 6;
  x.beginPath(); x.roundRect(m, m, W - 2*m, H - 2*m, r); x.stroke();
  return c;
}

const BARS = [[192,192,192],[192,192,0],[0,192,192],[0,192,0],[192,0,192],[192,0,0],[0,0,192]];
function makeCrtBars(){
  const c = toBits(q=>{
    const bw = 1600/7;
    BARS.forEach((k, i)=>{ q.fillStyle = `rgb(${k})`; q.fillRect(i*bw, 0, bw + 1, 800); });
    const mid = [BARS[6], [16,16,16], BARS[4], [16,16,16], BARS[2], [16,16,16], BARS[0]];
    mid.forEach((k, i)=>{ q.fillStyle = `rgb(${k})`; q.fillRect(i*bw, 800, bw + 1, 100); });
    const low = [[0,33,76], [255,255,255], [50,0,106], [16,16,16], [6,6,6], [16,16,16], [26,26,26], [16,16,16]];
    const lw = [1.25, 1.25, 1.25, 1.25, 0.33, 0.34, 0.33, 1].map(v => v*bw);
    let lx = 0; low.forEach((k, i)=>{ q.fillStyle = `rgb(${k})`; q.fillRect(lx, 900, lw[i] + 1, 300); lx += lw[i]; });
  }, {seed:71, fill:0.8});
  // each bar's colour written in hex
  const x = c.getContext('2d'); x.font = `bold 30px ${MONO}`; x.textAlign = 'center';
  BARS.forEach((k, i)=>{
    x.fillStyle = 'rgba(0,0,0,.6)'; x.fillRect(i*1600/7 + 24, 690, 1600/7 - 48, 50);
    x.fillStyle = '#fff'; x.fillText('#' + k.map(hx2).join(''), i*1600/7 + 1600/14, 726);
  });
  return crtFinish(c);
}

function makeCrtSnow(){
  // 砂嵐: every digit a random grey, with a few torn lines and a slow rolling band
  const tears = [210, 530, 860];
  const c = bitScene({seed:72, bg:'#000', fill:0.7, fs:16, dx:13, dy:18, color:(px, y, rnd)=>{
    let v = rnd()**1.4*255;
    if (tears.some(t => Math.abs(y - t) < 18)) v = 120 + rnd()*135;
    const band = Math.exp(-(((y - 700)/120)**2))*0.35;
    v = v*(1 - band) + 30*band;
    return rnd() < 0.03 ? [v*0.8, v*0.9, v] : [v, v, v];
  }});
  return crtFinish(c);
}

function makeCrtTestCard(){
  // a test card: grid, big circle, grey steps, colour steps, fine stripes and a centre cross
  const c = toBits(q=>{
    q.fillStyle = '#6e6e6e'; q.fillRect(0, 0, 1600, 1200);
    q.strokeStyle = '#eee'; q.lineWidth = 5;
    for (let gx = 0; gx <= 1600; gx += 100){ q.beginPath(); q.moveTo(gx, 0); q.lineTo(gx, 1200); q.stroke(); }
    for (let gy = 0; gy <= 1200; gy += 100){ q.beginPath(); q.moveTo(0, gy); q.lineTo(1600, gy); q.stroke(); }
    q.save(); q.beginPath(); q.arc(800, 600, 470, 0, 7); q.clip();
    q.fillStyle = '#222'; q.fillRect(0, 0, 1600, 1200);
    BARS.forEach((k, i)=>{ q.fillStyle = `rgb(${k})`; q.fillRect(330 + i*134, 160, 135, 260); });
    for (let i = 0; i < 8; i++){ const v = i*36; q.fillStyle = `rgb(${v},${v},${v})`; q.fillRect(330 + i*118, 430, 119, 160); }
    for (let i = 0; i < 4; i++) for (let sx = 0; sx < 230; sx += 2 + i*2){       // stripes getting finer
      q.fillStyle = (sx/(2 + i*2)) % 2 ? '#111' : '#eee'; q.fillRect(330 + i*235 + sx, 600, 1 + i, 170);
    }
    const g = q.createLinearGradient(330, 0, 1270, 0);
    ['#f00', '#ff0', '#0f0', '#0ff', '#00f', '#f0f', '#f00'].forEach((k, i)=> g.addColorStop(i/6, k));
    q.fillStyle = g; q.fillRect(330, 780, 940, 160);
    q.restore();
    q.strokeStyle = '#fff'; q.lineWidth = 8; q.beginPath(); q.arc(800, 600, 470, 0, 7); q.stroke();
    q.lineWidth = 6; q.beginPath(); q.moveTo(800, 470); q.lineTo(800, 730); q.moveTo(670, 600); q.lineTo(930, 600); q.stroke();
    q.beginPath(); q.arc(800, 600, 60, 0, 7); q.stroke();
  }, {seed:73, fill:0.75});
  return crtFinish(c);
}

function makeCrtPleaseWait(){
  // the screen shown while the broadcast is stopped: a still picture and a message
  const c = toBits(q=>{
    let g = q.createLinearGradient(0, 0, 0, 1200);
    g.addColorStop(0, '#7fb6e8'); g.addColorStop(0.65, '#d9ecf7'); g.addColorStop(0.66, '#b38a5c'); g.addColorStop(1, '#7a5634');
    q.fillStyle = g; q.fillRect(0, 0, 1600, 1200);
    // a vase of flowers on a table
    q.fillStyle = '#3f7fbf'; q.beginPath(); q.moveTo(720, 790); q.bezierCurveTo(640, 700, 700, 560, 760, 540);
    q.lineTo(840, 540); q.bezierCurveTo(900, 560, 960, 700, 880, 790); q.closePath(); q.fill();
    q.strokeStyle = '#3e8a3a'; q.lineWidth = 10;
    const fl = [[640, 300, '#f25c78'], [800, 240, '#ffd23f'], [960, 300, '#f28c28'], [700, 400, '#ffffff'], [900, 400, '#c86dd7'], [800, 350, '#f25c78']];
    for (const [fx, fy] of fl){ q.beginPath(); q.moveTo(800, 560); q.quadraticCurveTo((fx + 800)/2, fy + 120, fx, fy); q.stroke(); }
    for (const [fx, fy, k] of fl){
      q.fillStyle = k;
      for (let p = 0; p < 6; p++){ const a = p/6*Math.PI*2; q.beginPath(); q.arc(fx + Math.cos(a)*38, fy + Math.sin(a)*38, 30, 0, 7); q.fill(); }
      q.fillStyle = '#ffe9a0'; q.beginPath(); q.arc(fx, fy, 26, 0, 7); q.fill();
    }
  }, {seed:74, fill:0.72});
  // the message stays sharp, like the caption of an old broadcast
  const x = c.getContext('2d');
  x.font = `bold 108px "Zen Maru Gothic", "Hiragino Maru Gothic ProN", sans-serif`; x.textAlign = 'center';
  x.lineWidth = 16; x.strokeStyle = '#1a2a55'; x.strokeText('しばらくお待ちください', 800, 1010);
  x.fillStyle = '#fff'; x.fillText('しばらくお待ちください', 800, 1010);
  return crtFinish(c);
}

/* ---------- 数学の模様 ---------- */
function escapeHue(zr, zi, cr, ci, maxIt){
  let i = 0;
  for (; i < maxIt && zr*zr + zi*zi < 16; i++){ const t = zr*zr - zi*zi + cr; zi = 2*zr*zi + ci; zr = t; }
  if (i >= maxIt) return -1;
  return i + 1 - Math.log2(Math.log2(zr*zr + zi*zi)/2);              // smooth count
}

function makeMandelbrot(){
  // the Mandelbrot set: points c where z → z² + c never runs away
  return bitScene({seed:81, bg:'#000', fill:0.55, fs:13, dx:10, dy:14, color:(px, y)=>{
    const cr = -2.25 + (px + 5)/1600*3.2, ci = -1.2 + (y + 7)/1200*2.4;
    const n = escapeHue(0, 0, cr, ci, 120);
    if (n < 0) return [20,10,40];
    const t = Math.sqrt(Math.max(0, n)/120);
    return hsv((0.6 + t*1.6) % 1, 0.8, Math.min(1, 0.3 + t*1.4));
  }});
}

function makeJulia(){
  // a Julia set: the same rule, but c is fixed and z starts at each point
  const cr = -0.8, ci = 0.156;
  return bitScene({seed:82, bg:'#000', fill:0.55, fs:13, dx:10, dy:14, color:(px, y)=>{
    const zr = -1.75 + (px + 5)/1600*3.5, zi = -1.31 + (y + 7)/1200*2.62;
    const n = escapeHue(zr, zi, cr, ci, 150);
    if (n < 0) return [30,10,50];
    const t = Math.sqrt(Math.max(0, n)/150);
    return hsv((0.55 + t*1.2) % 1, 0.75, Math.min(1, 0.2 + t*1.6));
  }});
}

function makeSierpinskiAnd(){
  // column AND row: where the answer is 0, a Sierpinski triangle appears
  const cell = 16, cols = 100, rows = 75;
  const [c, x] = plainCanvas();
  x.fillStyle = '#07060d'; x.fillRect(0, 0, 1600, 1200);
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `bold 13px ${MONO}`;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++){
    const v = k & r, ok = v === 0;
    const rgb = ok ? hsv((r/rows*0.7 + k/cols*0.3) % 1, 0.75, 1) : hsv(0.7, 0.4, 0.18 + 0.05*Math.min(4, v.toString(2).split('1').length - 1));
    x.fillStyle = `rgb(${rgb.map(v => v*(ok ? 0.55 : 1) | 0)})`; x.fillRect(k*cell, r*cell, cell, cell);
    x.fillStyle = ok ? `rgb(${rgb})` : 'rgba(255,255,255,.18)';
    x.fillText(ok ? '0' : '1', k*cell + cell/2, r*cell + cell/2 + 1);
  }
  return c;
}

function makeUlamSpiral(){
  // numbers written in a square spiral; the primes (1) line up on slanting lines
  const cell = 16, cols = 100, rows = 75;
  const N = cols*rows + 400, isP = new Uint8Array(N + 1).fill(1); isP[0] = isP[1] = 0;
  for (let i = 2; i*i <= N; i++) if (isP[i]) for (let j = i*i; j <= N; j += i) isP[j] = 0;
  const grid = new Map();
  let gx = 0, gy = 0, n = 1, step = 1, dir = 0; const D = [[1,0],[0,-1],[-1,0],[0,1]];
  grid.set('0,0', 1);
  while (n < N){
    for (let rep = 0; rep < 2 && n < N; rep++){
      for (let s = 0; s < step && n < N; s++){ gx += D[dir][0]; gy += D[dir][1]; grid.set(gx + ',' + gy, ++n); }
      dir = (dir + 1) % 4;
    }
    step++;
  }
  const [c, x] = plainCanvas();
  x.fillStyle = '#05070c'; x.fillRect(0, 0, 1600, 1200);
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `bold 13px ${MONO}`;
  for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++){
    const v = grid.get((k - 50) + ',' + (r - 37)) || 0, p = isP[v];
    const rgb = p ? hsv((Math.log(v)/Math.log(N)*0.8 + 0.55) % 1, 0.7, 1) : [40,46,64];
    if (p){ x.fillStyle = `rgb(${rgb.map(u => u*0.45 | 0)})`; x.fillRect(k*cell, r*cell, cell, cell); }
    x.fillStyle = `rgb(${rgb})`; x.fillText(p ? '1' : '0', k*cell + cell/2, r*cell + cell/2 + 1);
  }
  return c;
}

function makeTimesMod(){
  // (column × row) mod 17, each remainder its own colour, written in hex
  const cell = 25, m = 17;
  const [c, x] = plainCanvas();
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `bold 11px ${MONO}`;
  for (let r = 0; r < 48; r++) for (let k = 0; k < 64; k++){
    const v = ((k - 32)*(r - 24) % m + m) % m;
    const rgb = v === 0 ? [250,250,245] : hsv(v/m, 0.7, 0.45 + 0.5*((v*7) % m)/m);
    x.fillStyle = `rgb(${rgb})`; x.fillRect(k*cell, r*cell, cell, cell);
    x.fillStyle = 0.299*rgb[0] + 0.587*rgb[1] + 0.114*rgb[2] > 140 ? 'rgba(0,0,0,.55)' : 'rgba(255,255,255,.6)';
    x.fillText(hx2(v), k*cell + cell/2, r*cell + cell/2 + 1);
  }
  return c;
}

function makeLissajous(){
  // Lissajous curves x = sin(a·t + δ), y = sin(b·t), drawn with 0s and 1s
  const [c, x] = canvasDark('#06060e'), rnd = seeded(86);
  const curves = [[3, 4, Math.PI/2, 560, 0.0], [5, 4, Math.PI/4, 470, 0.15], [3, 2, Math.PI/2, 380, 0.5],
                  [1, 2, Math.PI/4, 290, 0.33], [5, 6, Math.PI/2, 210, 0.75], [1, 1, Math.PI/2, 110, 0.9]];
  curves.forEach(([a, b, dl, R, hue])=>{
    let lx = -99, ly = -99;
    for (let t = 0; t < Math.PI*2; t += 0.0004){
      const px = 800 + R*1.3*Math.sin(a*t + dl), py = 600 + R*Math.sin(b*t);
      if (Math.hypot(px - lx, py - ly) < 11) continue;
      lx = px; ly = py;
      glyphAt(x, rnd() < 0.5 ? '0' : '1', px, py, 0, 13, hsv((hue + t/(Math.PI*2)*0.2) % 1, 0.75, 0.98));
    }
  });
  return c;
}

refreshContinue();
